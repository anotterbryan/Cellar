<title>The Cellar Lyceum</title>
<meta name="theme-color" content="#4A1520">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ox:#6E1E2B;--ox2:#4A1520;--ink:#2B201A;--gold:#A8833B;--gold2:#C9A55A;--paper:#FBF7EE;--tint:#F3EADA;--rule:#D8C7A2;--muted:#8a7558}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'EB Garamond',Georgia,serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}
header{background:var(--ox2);color:#F2E3C2;padding:14px 18px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .sc{font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:var(--gold2)}
.brand h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:1}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tab{border:1px solid rgba(242,227,194,.4);background:transparent;color:#F2E3C2;border-radius:18px;padding:6px 14px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:#F2E3C2;color:var(--ox2);border-color:#F2E3C2}
.search{margin-left:auto;position:relative}
.search input{border:none;border-radius:18px;padding:7px 14px;width:220px;max-width:60vw;font-family:Inter,sans-serif;font-size:13px;background:#FBF7EE;color:var(--ink)}
.sugg{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--rule);border-radius:10px;width:300px;max-width:88vw;max-height:320px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30}
.sugg div{padding:8px 12px;font-family:Inter,sans-serif;font-size:13px;cursor:pointer;color:var(--ink)}
.sugg div:hover,.sugg div.act{background:var(--tint)}
.sugg small{color:var(--muted);margin-left:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0;align-items:center}
.flab{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1.4px solid;border-radius:14px;padding:3px 10px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;background:transparent;cursor:pointer}
.chip.on{color:#fff!important}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:8px 18px 24px;align-items:start}
.stage{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:6px;position:relative}
.stage svg{width:100%;height:auto;display:block;touch-action:manipulation}
.hint{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 8px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.panel h2{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ox);font-size:26px;margin:0 0 2px;line-height:1.1}
.meta{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-bottom:8px}
.badge{display:inline-block;font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:10px;margin-right:4px}
.panel p{margin:6px 0 10px;font-size:16px;line-height:1.4}
.tchip{display:inline-block;border:none;border-radius:12px;padding:3px 10px;margin:2px 3px 3px 0;font-family:Inter,sans-serif;font-size:12px;cursor:pointer}
.sec{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ox);margin:12px 0 4px}
.bars{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-family:Inter,sans-serif;font-size:11px;color:var(--muted);align-items:center}
.bar{display:flex;gap:3px}.bar i{flex:1;height:7px;border-radius:3px;background:#E9DFCB}.bar i.f{background:var(--ox)}
.row{font-size:15px;line-height:1.38;margin:3px 0}
.link{color:var(--ox);cursor:pointer;border-bottom:1px dotted var(--gold)}
.src{font-family:Inter,sans-serif;font-size:10.5px;color:var(--muted);margin-top:12px}
.empty{color:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:Inter,sans-serif;font-size:11px;color:var(--ink);padding:6px 10px 10px;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
svg text{font-family:Inter,sans-serif;cursor:pointer;user-select:none}
.node text{transition:opacity .2s}
.dim{opacity:.13}
.edge{transition:opacity .2s}
.tabsep{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);align-self:center;margin:0 2px 0 8px}
.sbub{display:inline-flex;align-items:stretch;border-radius:16px;overflow:hidden;border:1.4px solid var(--rule);background:#fff;margin:2px 4px 2px 0}
.sbub .bl{border:none;background:var(--tint);color:var(--ink);font-family:Inter,sans-serif;font-size:12px;font-weight:700;padding:4px 10px;cursor:pointer}
.sbub .bl.on{background:var(--ox2);color:#F2E3C2}
.sbub .sg{border:none;font-family:Inter,sans-serif;font-size:11px;font-weight:600;padding:4px 9px;cursor:pointer;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.sbub .sg.on{box-shadow:inset 0 0 0 2.5px #fff,inset 0 0 0 4px var(--ox2)}
.sbub .sg.dim{opacity:.35}
.hero{background:linear-gradient(160deg,#4A1520,#6E1E2B 60%,#7d2a36);color:#F2E3C2;border-radius:16px;padding:26px 22px;margin-bottom:14px}
.hero .k{font-family:'Cormorant SC',serif;letter-spacing:.3em;font-size:12px;color:var(--gold2)}
.hero h2{color:#F2E3C2!important;font-size:34px!important;line-height:1.05;margin:6px 0 10px!important}
.hero p{font-size:17px;color:#F2E3C2;opacity:.92;max-width:560px}
.hero .bigbtn{background:#F2E3C2;color:var(--ox2);font-size:17px;padding:14px 26px;margin-top:6px}
.hero .alt{display:block;margin-top:10px;font-family:Inter,sans-serif;font-size:13px;color:#F2E3C2;opacity:.85;cursor:pointer;text-decoration:underline}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.steps div{background:var(--tint);border-radius:12px;padding:12px;font-size:15px;line-height:1.35}
.steps b{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ox);margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff}
.card:hover{border-color:var(--ox)}
.card .t{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--ox)}
.card .d{font-size:14.5px;line-height:1.35;color:var(--ink)}
.homeh{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ox);margin:18px 0 8px}
@media (max-width:600px){.steps,.cards{grid-template-columns:1fr}.hero h2{font-size:29px!important}}
.fbox{background:var(--tint);border-radius:12px;padding:12px 14px;margin:12px 0}
.frow{margin:8px 0}.frow .fl{font-family:Inter,sans-serif;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow input,.frow select{width:100%;max-width:420px;font-size:16px!important}
.okc,.edc,.askc{font-weight:600;font-size:11px;border-radius:9px;padding:1px 7px}
.okc{background:#DDEBD9;color:#2F6B3A}.edc{background:#E8E1F0;color:#5B3F7A}.askc{background:#F6E2C4;color:#8A5A12}
.liveov{position:fixed;inset:0;background:rgba(20,8,12,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.livebox{position:relative;width:100%;max-width:520px;border-radius:14px;overflow:hidden;background:#000}.livebox video{width:100%;display:block}
.liveguide{position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:3px solid #F2E3C2;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.livetxt{color:#F2E3C2;font-family:Inter,sans-serif;font-size:15px;margin:14px 0;text-align:center}.livebtns{display:flex;gap:8px}
.sttip{display:none;background:#FFF7E6;border:1px solid var(--gold2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);margin-bottom:8px;line-height:1.4}
.snapbtns{display:flex;flex-wrap:wrap;gap:10px}.bigbtn.alt2{background:#fff;color:var(--ox);border:2px solid var(--ox)}
.learn{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.looklinks{margin:6px 0 4px}.looklinks .k,.wiki .k{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.looklinks .btn{text-decoration:none}.wiki.topic summary{cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ox)}
.aiwiki{border-left-color:#7A5BA8;background:#F5F1F9}.aiwiki .k{color:#7A5BA8}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs .snapimg{max-height:220px}
.rawbox{margin:10px 0;font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}.rawbox summary{cursor:pointer;margin-bottom:6px}
.page{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px 20px;display:none}
.page h2{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--ox);font-size:28px;margin:0 0 4px}
.page p{font-size:16px;line-height:1.45;margin:6px 0 12px}
.bigbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ox);color:#F2E3C2;border:none;border-radius:24px;padding:12px 22px;font-family:Inter,sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.btn{display:inline-flex;align-items:center;white-space:nowrap;background:#fff;border:1.4px solid var(--ox);color:var(--ox);border-radius:18px;padding:6px 14px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
.btn.solid{background:var(--ox);color:#F2E3C2}
.snapimg{max-width:100%;max-height:300px;border-radius:10px;display:block;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.status{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:6px 0}
.page textarea{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:10px;padding:10px;font-family:Inter,sans-serif;font-size:14px;background:var(--paper)}
.page label.lab,.flab2{display:block;font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ox);margin:14px 0 4px}
.result{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.matchname{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ox);font-weight:600}
.page input[type=number],.page input[type=text],.page select{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-family:Inter,sans-serif;font-size:14px;background:#fff}
.vbadge{display:inline-block;color:#fff;font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:10px}
.vbox{background:var(--tint);border-radius:10px;padding:10px 12px;margin:6px 0}
.wiki{background:#F7F4EC;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 12px;margin-top:10px}
.wiki .k{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.bot{display:grid;grid-template-columns:64px 1fr;gap:12px;border-bottom:1px solid var(--rule);padding:12px 0}
.bot img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--tint)}
.bot .n{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ox);font-weight:600;cursor:pointer}
.bot .m{font-family:Inter,sans-serif;font-size:12px;color:var(--muted)}
.bot .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-family:Inter,sans-serif;font-size:12px}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);background:#fff;cursor:pointer}
.tonight{background:var(--ox2);color:#F2E3C2;border-radius:12px;padding:12px 16px;margin:8px 0 14px}
.tonight .k{font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--gold2)}
.tonight .t{font-family:'Cormorant Garamond',serif;font-size:22px;cursor:pointer}
.seg{display:inline-flex;border:1.4px solid var(--ox);border-radius:18px;overflow:hidden;margin:4px 0 8px}
.seg button{border:none;background:#fff;color:var(--ox);padding:6px 14px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ox);color:#F2E3C2}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 .panel{position:static;max-height:none}
 .search{margin-left:0;width:100%;margin-top:8px}.search input{width:100%;max-width:none}
}

alla)","aka":["Ribolla Gialla on skins","Oslavia Ribolla","Venezia Giulia IGT Ribolla"],"grapes":["Ribolla Gialla"],"country":"Italy","region":"Friuli Venezia Giulia – Collio / Oslavia","group":"it","style":"orange","descriptors":["bruised apple","orange peel","apricot","hazelnut","honey","dried herbs","grippy","savory"],"structure":{"sweetness":1,"acidity":4,"tannin":3,"alcohol":3,"body":4},"abv":"12.5-14%","window":{"from":2,"peak_start":5,"peak_end":12,"to":15,"top_to":25},"price":"$$$-$$$$","serve_f":"55-60","decant":"30 min","pairings":{"classic":["Prosciutto di San Daniele","Frico (Friulian cheese and potato)","Roast pork"],"creative":["Indian curries","Kimchi fried rice"],"avoid":["Delicate raw shellfish"]},"kindred":["Georgian Amber Rkatsiteli (Qvevri)","Jura Vin Jaune","Fiano di Avellino"],"accent":"In the Oslavia hills, thick-skinned Ribolla is macerated on its skins for weeks to months, a local practice revived after the late 1990s by Gravner (Georgian-style amphorae) and Radikon (wooden vats), yielding amber wines with tannic grip and body that light, crisp Ribolla never has.","summary":"This is white wine made like red wine, with the grape skins left in for a long time, which turns it amber and gives it a light tannic grip. It tastes of dried apricot, orange peel, nuts and herbs and is great with hearty, savory food.","sources":["https://winefolly.com/deep-dive/orange-wine/","https://internationalwinechallenge.com/Canopy-Articles/five-lessons-from-oslavia.html","https://www.jancisrobinson.com/learn/grape-varieties/white/ribolla-gialla"],"confidence":"high"},{"id":"gavi","name":"Gavi","aka":["Gavi DOCG","Cortese di Gavi","Gavi di Gavi / Gavi del Comune di Gavi"],"grapes":["Cortese"],"country":"Italy","region":"Piedmont – Alessandria (southeast)","group":"it","style":"crisp","descriptors":["lemon","green apple","white flowers","almond","pear","saline","crisp","fresh"],"structure":{"sweetness":1,"acidity":4,"tannin":1,"alcohol":2,"body":2},"abv":"11.5-12.5 nd most acidic, while Grasparossa and Salamino are deeper in colour and more noticeably tannic.","summary":"Lambrusco is a fizzy red wine from Emilia-Romagna, the home of Parma ham and Parmesan. Good dry versions are fruity, tangy and refreshing — serve them chilled with salumi or pizza.","sources":["https://winefolly.com/grapes/lambrusco/","https://www.decanter.com/decanter-world-wine-awards/world-lambrusco-day-six-award-winning-styles-to-try-482816","https://www.pressreader.com/uk/decanter/20240401/283068419301166"],"confidence":"high"},{"id":"montepulciano-dabruzzo","name":"Montepulciano d'Abruzzo","aka":["Montepulciano d'Abruzzo DOC","Colline Teramane DOCG (related)"],"grapes":["Montepulciano"],"country":"Italy","region":"Abruzzo","group":"it","style":"mred","descriptors":["red plum","blackberry","black pepper","dried herbs","baking spice","earth","rustic"],"structure":{"sweetness":1,"acidity":3,"tannin":3,"alcohol":3,"body":4},"abv":"12.5-14%","window":{"from":0,"peak_start":1,"peak_end":4,"to":6,"top_to":15},"price":"$-$$","serve_f":"60-65","decant":"30 min","pairings":{"classic":["Arrosticini (lamb skewers)","Sausage pizza","Pasta alla chitarra with ragù"],"creative":["Smoked andouille sausage","Barbecue burgers"],"avoid":["Delicate white fish"]},"kindred":["Nero d'Avola","Barbera d'Asti / d'Alba","Primitivo di Manduria"],"accent":"Abruzzo's Montepulciano grape gives a deeply colored, plummy, peppery red with soft-to-medium tannins at everyday prices; higher, cooler sites in Teramo and Pescara yield more concentrated wines.","summary":"Montepulciano d'Abruzzo is a dark, plummy, slightly rustic red from central Italy's Adriatic side and one of Italy's best values. It loves pizza, sausage and grilled meats.","sources":["https://italianwinecentral.com/denomination/montepulciano-dabruzzo-doc/","https://winefolly.com/grapes/montepulciano/","https://en.wikipedia.org/wiki/Montepulciano_d%27Abruzzo"],"confidence":"high"},{"id":"moscato-dasti","name":"Moscato d'Asti", nd the best examples are often compared to red Burgundy.","sources":["https://www.decanter.com/wine-reviews-tastings/wine-panel-tastings/australian-pinot-noir-panel-tasting-results-54017","https://www.winecompanion.com.au/wineries/victoria/yarra-valley","https://www.jancisrobinson.com/fr/articles/giant-steps-pinot-noir-2020-yarra-valley","https://winefolly.com/grapes/pinot-noir/"],"confidence":"high","group":"sh"},{"id":"bekaa-valley-red","name":"Bekaa Valley Red (Lebanon)","aka":["Lebanese red"],"grapes":["Cabernet Sauvignon","Cinsault","Carignan","Syrah","Grenache"],"country":"Lebanon","region":"Bekaa Valley","group":"ri","style":"fred","descriptors":["plum","black cherry","baking spice","tobacco","cedar","dried fruit","chocolate","plush"],"structure":{"sweetness":1,"acidity":3,"tannin":4,"alcohol":4,"body":4},"abv":"13.5-14.5%","window":{"from":3,"peak_start":6,"peak_end":15,"to":20,"top_to":30},"price":"$$-$$$","serve_f":"60-65","decant":"1-2 hr","pairings":{"classic":["lamb kofta","slow-roasted lamb shoulder","grilled meats with seven-spice"],"creative":["mushroom and lentil stew","duck with pomegranate molasses"],"avoid":["delicate white fish"]},"kindred":["Bandol Rouge","Châteauneuf-du-Pape","Left Bank Bordeaux (Pauillac, Margaux, Saint-Julien)"],"accent":"High vineyards (about 1,000-1,200 m) give the hot, dry Bekaa cool evenings, and its Bordeaux-plus-Mediterranean blends tend toward sweet, opulent fruit with exotic spice and firm tannins that let them age well.","summary":"Lebanon's main red-wine region makes rich, spicy blends of Cabernet with Mediterranean grapes like Cinsault and Syrah. Expect ripe plum and cherry, spice, cedar and tobacco, with good aging potential.","sources":["https://www.decanter.com/features/regional-profile-lebanon-245998/","https://www.decanter.com/wine-news/opinion/jefford-on-monday/red-wines-lebanon-bekaa-350774/","https://www.jancisrobinson.com/learn/wine-regions/lebanon","https://vinepair.com/good-wine-reviews/best-wines-bekaa  herbs","pan-fried trout","pork paprikash"],"creative":["sushi","pork dumplings"],"avoid":["very sweet desserts"]},"kindred":["Savennières","Chablis","Santorini Assyrtiko"],"accent":"Tokaj's volcanic soils and Furmint's 'life-saving' acidity yield a dry white of smoky minerality and long aging potential, often compared to Savennières, white Burgundy or Mosel Riesling.","summary":"A dry Hungarian white with quince, apple and citrus, a smoky, stony note and very high acidity. Often oak-fermented, it can gain richness and age for many years.","sources":["https://winefolly.com/grapes/furmint/","https://www.jancisrobinson.com/articles/why-furmint-went-dry"],"confidence":"high"},{"id":"english-sparkling-wine","name":"English Sparkling Wine","aka":["English Quality Sparkling Wine","Classic Cuvée"],"grapes":["Chardonnay","Pinot Noir","Pinot Meunier"],"country":"England","region":"Southern England (Sussex, Kent, Hampshire, Surrey, Dorset)","group":"ri","style":"spark","descriptors":["green apple","lemon","pear","brioche","toast","chalk","racy","fine mousse"],"structure":{"sweetness":2,"acidity":5,"tannin":1,"alcohol":2,"body":2},"abv":"11.5-12.5%","window":{"from":0,"peak_start":2,"peak_end":6,"to":10,"top_to":15},"price":"$$$-$$$$","serve_f":"43-48","decant":"none","pairings":{"classic":["fish and chips","oysters","smoked salmon"],"creative":["fried chicken","Parmesan crisps"],"avoid":["sweet desserts (for brut styles)"]},"kindred":["Champagne Brut NV","Blanc de Blancs Champagne","Cap Classique"],"accent":"England's cooler-than-Champagne climate, with chalk in parts of Kent, Sussex, Hampshire and Dorset and greensand and clay elsewhere, yields traditional-method sparklers with notably high acidity, citrus and orchard fruit and a precise, linear style.","summary":"Traditional-method sparkling wine from southern England made from the Champagne grapes. It's crisp and lively, with apple and citrus fruit, a chalky edge and toasty notes from lees aging.","sources":["https://www.jancisrobinson.com/articles/an-awfully-big-english-adventure","https://www.decanter.com/wine/united-kingdom/panel-tasting-results-30-mightily-impressive-english-sparkling-wines/","https://www.wineenthusiast.com/ratings/wine-ratings/english-sparkling-wine-2/","https://www.decanter.com/wine/the-sommelier-suggests-english-sparkling-wine-by-charles-carron-brown-542871/"],"confidence":"high"},{"id":"georgian-amber-rkatsiteli","name":"Georgian Amber Rkatsiteli (Qvevri)","aka":["Amber wine","Qvevri Rkatsiteli","Kakhetian-method white"],"grapes":["Rkatsiteli"],"country":"Georgia","region":"Kakheti","group":"ri","style":"orange","descriptors":["dried fruit","apricot","walnut","honey","orange peel","dried herbs","grippy","savory"],"structure":{"sweetness":1,"acidity":3,"tannin":3,"alcohol":3,"body":4},"abv":"12-13.5%","window":{"from":1,"peak_start":2,"peak_end":6,"to":10,"top_to":15},"price":"$$-$$$","serve_f":"52-58","decant":"30 min","pairings":{"classic":["khachapuri","grilled pork mtsvadi","walnut-stuffed eggplant"],"creative":["Indian lamb curry","kimchi fried rice"],"avoid":["light, delicate desserts"]},"kindred":["Friulian Orange Wine (Ribolla Gialla)","Jura Vin Jaune","Fino & Manzanilla Sherry"],"accent":"In the Kakhetian method, Rkatsiteli ferments and macerates on its skins (often with stems and seeds) in buried clay qvevri, giving deep amber color, real tannin and nutty, dried-fruit depth.","summary":"An ancient-style Georgian white made like a red—fermented on its skins in clay jars buried underground. It's amber-colored, dry and grippy, with dried apricot, walnut and honey notes.","sources":["https://winefolly.com/deep-dive/orange-wine/","https://plus.winefolly.com/rkatsiteli/","https://www.decanter.com/wine-reviews/georgia/kakheti/orgo-qvevri-rkatsiteli-kakheti-georgia-2016-20062","https://en.wikipedia.org/wiki/Georgian_wine"],"confidence":"high"},{"id":"georgian-saperavi","name":"Georgian Saperavi","aka":["Saperavi","Mukuzani","Napareuli"],"grapes":["Saperavi"] inned grape grown mainly in Yamanashi's Kofu Basin north of Mount Fuji, Koshu makes a very light, low-alcohol, delicate and pure white, often lees-aged (sur lie) for texture and umami.","summary":"Japan's signature white grape gives a pale, light and delicate dry wine with gentle citrus (often yuzu-like), white peach and floral notes. It's made to drink young and pairs beautifully with Japanese food.","sources":["https://www.jancisrobinson.com/de/articles/koshu-gets-a-passport","https://www.decanter.com/wine-reviews-tastings/japanese-koshu-wineries-354235/","https://www.decanter.com/wine/japan/yamanashi-regional-profile-six-star-wines-to-try/","https://www.wine-business-international.com/wine/styles-regions/japans-aromatic-white"],"confidence":"high"},{"id":"naoussa-xinomavro","name":"Naoussa Xinomavro","aka":["Naoussa PDO","Xinomavro"],"grapes":["Xinomavro"],"country":"Greece","region":"Naoussa, Macedonia","group":"ri","style":"mred","descriptors":["sour cherry","strawberry","tomato","olive","dried herbs","mushroom","grippy","structured"],"structure":{"sweetness":1,"acidity":5,"tannin":4,"alcohol":4,"body":3},"abv":"13-14.5%","window":{"from":3,"peak_start":6,"peak_end":15,"to":20,"top_to":30},"price":"$$-$$$","serve_f":"60-65","decant":"1-2 hr","pairings":{"classic":["roast lamb with herbs","mushroom risotto","moussaka"],"creative":["dry-aged steak","tomato-braised beef stifado"],"avoid":["delicate white fish","very sweet dishes"]},"kindred":["Barolo","Barbaresco","Etna Rosso"],"accent":"Naoussa Xinomavro is often called Greece's Nebbiolo: pale in color but high in acid and tannin, with a hallmark savory tomato-and-olive note that turns to mushroom and truffle with age.","summary":"A pale but firmly structured Greek red with sour cherry, strawberry and savory tomato and olive notes. Its high acidity and tannins need time, and top bottles age for decades.","sources":["https://winesofgreece.org/?p=1085","https://winefolly.com/grapes/xinomavro/","https://wineanorak.c a or southeastern Australia with ripe fruit, vanilla and butter, while unoaked versions (Chablis, Sonoma Coast, cool Chile or Western Australia, or anything labeled 'Unoaked') are leaner and crisper, with green apple, lemon and chalky notes.","summary":"Chardonnay is the world's best-known white grape and the classic everyday bottle is round and medium-to-full, with ripe apple and tropical fruit plus vanilla, toast and butter from oak. If the label says 'unoaked' or 'stainless steel', expect a lighter, zingier wine closer to Chablis.","sources":["https://winefolly.com/grapes/chardonnay/","https://winefolly.com/deep-dive/chardonnay-wine-guide/","https://www.decanter.com/wine/grape-varieties/chardonnay/"],"confidence":"high"},{"country":"Various","group":"gp","id":"chenin-blanc","name":"Chenin Blanc (general)","aka":["Steen","Pineau de la Loire"],"grapes":["Chenin Blanc"],"region":"Mainly South Africa, France (Loire Valley), California","style":"crisp","descriptors":["yellow apple","quince","pear","lemon","chamomile","honey","bright","juicy"],"structure":{"sweetness":2,"acidity":4,"tannin":1,"alcohol":3,"body":3},"abv":"12-13.5%","window":{"from":0,"peak_start":1,"peak_end":3,"to":5,"top_to":30},"price":"$-$$","serve_f":"45-50","decant":"none","pairings":{"classic":["Roast chicken or turkey","Pork with apples","Thai green curry"],"creative":["Fried chicken","Pork belly bao"],"avoid":["Heavy red-meat dishes","Very bitter greens"]},"kindred":["Vouvray","Swartland Chenin Blanc","Savennières"],"accent":"South Africa ('Steen'), the world's largest source, makes most everyday bottles in a fresh, fruity, dry-to-just-off-dry style, with richer oaked and old-vine versions from Swartland and Stellenbosch, while the Loire is leaner and more mineral and runs the full range from dry Savennières to off-dry or sweet Vouvray and sparkling Crémant.","summary":"Chenin Blanc is a lively, high-acid white with apple, pear, quince and honey notes that can be made bone dry, off-dry, sweet o lly dry, fuller and more citrus- or lime-driven, and US Rieslings from Washington and New York range from off-dry to dry.","summary":"Riesling is a high-acid, aromatic white with lime, apple, peach and floral notes, and it can be anything from bone dry to dessert-sweet, with the typical supermarket bottle lightly sweet. To tell, look for 'Trocken' or 'Dry' (dry), 'Halbtrocken'/'Feinherb' (off-dry), the back-label IRF sweetness scale, or the alcohol: under about 10% usually means noticeable sweetness, 12%+ usually means dry.","sources":["https://winefolly.com/grapes/riesling/","https://www.decanter.com/wine/grape-varieties/riesling/","https://www.germanwineusa.com/wine-guide/how-to-read-a-german-wine-label/"],"confidence":"medium"},{"country":"Various","group":"gp","id":"rose","name":"Rosé (general)","aka":["Rosado","Rosato","Dry Rosé"],"grapes":["Grenache","Cinsault","Syrah","Pinot Noir","Tempranillo","Sangiovese"],"region":"Grown worldwide (mainly France, Spain, Italy, USA)","style":"rose","descriptors":["strawberry","raspberry","white peach","lemon","rose","wet stone","crisp","fresh"],"structure":{"sweetness":2,"acidity":4,"tannin":1,"alcohol":3,"body":2},"abv":"11.5-13.5%","window":{"from":0,"peak_start":0,"peak_end":1,"to":2,"top_to":5},"price":"$-$$","serve_f":"45-50","decant":"none","pairings":{"classic":["Salade niçoise","Grilled shrimp","Charcuterie board"],"creative":["Fish tacos","Margherita pizza"],"avoid":["Heavy braised red meats","Rich chocolate desserts"]},"kindred":["Provence Rosé","California Rosé","Tavel"],"accent":"Provence sets the pale, bone-dry, mineral benchmark; Spanish Garnacha and Tempranillo rosados and Tavel are deeper, fruitier or more savory and fuller; California and other New World rosés are often riper with peach, melon and raspberry; and pink 'blush' wines such as White Zinfandel are a separate, noticeably sweet style.","summary":"Rosé is pink wine made from red grapes with only brief skin contact, and the typical bottle today is dry, light and refreshing, with strawberry, citrus and melon notes. Drink it young and chilled; if you want sweet, look for White Zinfandel or bottles labeled 'blush' or 'semi-sweet'.","sources":["https://winefolly.com/tutorial/guide-styles-of-rose-wine/","https://www.wine.com/content/article/dry-rose-wine-guide"],"confidence":"medium"},{"country":"Various","group":"gp","id":"sangiovese","name":"Sangiovese (general)","aka":["Prugnolo Gentile","Morellino","Nielluccio","Brunello"],"grapes":["Sangiovese"],"region":"Mainly Tuscany and central Italy; also California, Australia, Argentina, Corsica","style":"mred","descriptors":["sour cherry","cherry","tomato","dried herbs","leather","tobacco","savory","firm"],"structure":{"sweetness":1,"acidity":4,"tannin":3,"alcohol":3,"body":3},"abv":"12.5-14%","window":{"from":0,"peak_start":1,"peak_end":4,"to":7,"top_to":25},"price":"$-$$","serve_f":"60-65","decant":"30 min","pairings":{"classic":["Pasta with tomato or meat ragù","Pizza margherita","Bistecca alla fiorentina"],"creative":["Eggplant parmesan","Grilled sausages with peppers"],"avoid":["Sweet glazes","Delicate white fish"]},"kindred":["Chianti Classico","Brunello di Montalcino","Vino Nobile di Montepulciano"],"accent":"Chianti Classico is the savory, high-acid benchmark with sour cherry and herbs, Brunello di Montalcino is deeper, more tannic and long-aging, Romagna and basic IGT Toscana are lighter and fruitier, and New World versions (California, Australia) tend to be riper and rounder.","summary":"Sangiovese is Italy's most planted red grape and the heart of Chianti, tasting of tart cherry, tomato and dried herbs. Its bright acidity makes it a natural match for tomato sauces, pizza and grilled meats.","sources":["https://winefolly.com/grapes/sangiovese/","https://www.jancisrobinson.com/learn/grape-varieties/red/sangiovese"],"confidence":"high"},{"country":"Various","group":"gp","id":"sauvignon-blanc","name":"Sauvignon Blanc (general)","aka":["Fumé Blanc","Sauvignon"],"grapes":["Sauvignon Blanc"],"region":"Grown worldwide (mainly New Zealand, France, Chile, California, South Africa)","style":"crisp","descriptors":["grapefruit","gooseberry","passion fruit","cut grass","lime","bell pepper","crisp","racy"],"structure":{"sweetness":1,"acidity":4,"tannin":1,"alcohol":3,"body":2},"abv":"12-13.5%","window":{"from":0,"peak_start":0,"peak_end":2,"to":3,"top_to":8},"price":"$-$$","serve_f":"45-50","decant":"none","pairings":{"classic":["Goat cheese salad","Grilled fish with herb sauce","Oysters"],"creative":["Vietnamese summer rolls with herbs","Asparagus and pea risotto"],"avoid":["Red-meat stews","Sweet desserts"]},"kindred":["Marlborough Sauvignon Blanc","Sancerre","Casablanca Valley Sauvignon Blanc"],"accent":"New Zealand (Marlborough) gives the loudest passion-fruit, grapefruit and green-pepper version, the Loire (Sancerre, Pouilly-Fumé) is leaner and more mineral and flinty, Chile and South Africa sit in between, and California 'Fumé Blanc' or Bordeaux blends with Sémillon are often oaked and rounder.","summary":"Sauvignon Blanc is a zesty, refreshing dry white that smells of grapefruit, tropical fruit and freshly cut grass. It is best young and chilled, and is a natural partner for salads, seafood and goat cheese.","sources":["https://winefolly.com/grapes/sauvignon-blanc/","https://www.decanter.com/wine/grape-varieties/sauvignon-blanc/"],"confidence":"high"},{"country":"Various","group":"gp","id":"sparkling-wine","name":"Sparkling Wine (general)","aka":["Brut","Extra Dry","Demi-Sec","Bubbly","American Sparkling Wine"],"grapes":["Chardonnay","Pinot Noir","Chenin Blanc","French Colombard"],"region":"Grown worldwide (mainly USA (California), France, Spain, Italy)","style":"spark","descriptors":["green apple","pear","lemon","white peach","white flowers","crisp","fresh","bright"],"structure":{"sweetness":2,"acidity":4,"tannin":1,"alcohol":2,"body":2},"abv":"11-12.5%","window":{"from":0,"peak_start":0,"peak_end":1,"to":2,"top_to":3},"price":"$-$$","serve_f":"40-45","decant":"none","pairings":{"classic":["Potato chips and salty snacks","Fried chicken","Oysters"],"creative":["Popcorn with parmesan","Tempura vegetables"],"avoid":["Heavy red-meat stews","Very sweet desserts with a Brut"]},"kindred":["California Sparkling (Carneros, Anderson Valley)","Cava","Prosecco"],"accent":"Bottles made by the traditional bottle-fermented method (like Champagne, Cava and many California brands) taste toastier and more yeasty with finer bubbles, while cheaper tank-method (Charmat) bubblies taste simpler, fruitier and softer; on any label, Brut is the dry standard, Extra Dry is actually slightly sweeter than Brut, and Demi-Sec is clearly sweet.","summary":"A bottle labeled simply 'Sparkling Wine' is a crisp, fizzy white with apple, lemon and pear notes, and sometimes a light toasty or bready touch. Sweetness is printed on the label: Brut Nature/Extra Brut are driest, Brut is dry, Extra Dry is off-dry, and Demi-Sec and Doux are sweet enough for dessert.","sources":["https://legislation.gov.uk/eur/2019/33/annex/III/2020-01-31","https://www.winefolly.com/deep-dive/how-sparkling-wine-is-made/","https://vinepair.com/articles/decoding-sweetness-levels-on-sparkling-wine-labels"],"confidence":"medium"},{"id":"sweet-red","name":"Sweet Red Wine (general)","aka":["Semi-sweet red","Sweet red blend","Rosso dolce","Red moscato-style"],"grapes":["Various (often unspecified red blends)","Brachetto","Lambrusco"],"country":"Various","region":"Mainly Italy (Piedmont, Emilia-Romagna) and the United States (California and other states)","group":"gp","style":"sweet","descriptors":["jammy","raspberry","strawberry","cherry","blackberry","juicy","round","silky"],"structure":{"sweetness":4,"acidity":3,"tannin":2,"alcohol":2,"body":2},"abv":"5.5-12%","window":{"from":0,"peak_start":0,"peak_end":1,"to":2,"top_to":null},"price":"$","serve_f":"45-55","decant":"none","pairings":{"classic":["Milk or dark chocolate","Sweet-sauced barbecue ribs","Fresh berries with whipped cream"],"creative":["Spicy Korean fried chicken","Salty blue cheese"],"avoid":["Desserts sweeter than the wine","Delicate white fish"]},"kindred":["Lambrusco","Ruby & Reserve Port","California Moscato"],"accent":"Italian sweet reds (Brachetto, sweet Lambrusco and brands built on them) tend to be low in alcohol and lightly fizzy with rose and berry notes, while US sweet red blends are usually still, a little stronger and more jammy.","summary":"Sweet reds are easy-drinking red wines left noticeably sweet, tasting of jammy red berries and cherries with little bitterness. They are best served chilled, opened young and enjoyed with chocolate, barbecue or on their own.","sources":["https://winefolly.com/tips/list-of-sweet-red-wines/","https://vinepair.com/articles/sweet-red-wine-guide/","https://www.tastings.com/Wine-Review/Stella-Rosa-NV-Rosso-Semi-Sweet-Wine-02-18-2026.aspx"],"confidence":"medium"},{"country":"Various","group":"gp","id":"syrah-shiraz","name":"Syrah / Shiraz (general)","aka":["Syrah","Shiraz"],"grapes":["Syrah"],"region":"Grown worldwide (mainly Australia, Rhône Valley, California, Washington, South Africa, Chile)","style":"fred","descriptors":["blackberry","black pepper","plum","blueberry","chocolate","smoked meat","velvety","powerful"],"structure":{"sweetness":1,"acidity":3,"tannin":4,"alcohol":4,"body":4},"abv":"13.5-15%","window":{"from":1,"peak_start":2,"peak_end":5,"to":8,"top_to":25},"price":"$-$$","serve_f":"60-65","decant":"30 min","pairings":{"classic":["Grilled lamb chops","Barbecued brisket or ribs","Pepper-crusted steak"],"creative":["Lamb shawarma or gyros","Tandoori chicken"],"avoid":["Delicate white fish","Light salads"]},"kindred":["Barossa Valley Shiraz","Crozes-Hermitage","Washington Syrah"],"accent":"It is the same grape under two names: bottles labeled 'Shiraz' (usually Australian, especially Barossa) tend to be riper and richer with jammy blackberry and chocolate, while 'Syrah' (Rhône, Washington, cooler California) is usually more restrained, savory and peppery with smoky, meaty notes.","summary":"Syrah, called Shiraz in Australia, is a bold, dark red with blackberry, plum and a signature hint of black pepper. Riper 'Shiraz' styles lean toward chocolate and jam, while cooler 'Syrah' styles taste more peppery and savory.","sources":["https://winefolly.com/grapes/syrah/","https://www.jancisrobinson.com/learn/grape-varieties/red/syrah"],"confidence":"high"},{"country":"Various","group":"gp","id":"tempranillo","name":"Tempranillo (general)","aka":["Tinto Fino","Tinta del País","Tinta de Toro","Tinta Roriz","Aragonez","Cencibel","Ull de Llebre"],"grapes":["Tempranillo"],"region":"Mainly Spain (Rioja, Ribera del Duero, La Mancha) and Portugal; also Texas, Argentina, US West Coast","style":"mred","descriptors":["cherry","plum","leather","tobacco","vanilla","dill","savory","structured"],"structure":{"sweetness":1,"acidity":3,"tannin":3,"alcohol":4,"body":3},"abv":"13-14.5%","window":{"from":0,"peak_start":1,"peak_end":5,"to":8,"top_to":25},"price":"$-$$","serve_f":"60-65","decant":"30 min","pairings":{"classic":["Roast lamb","Chorizo and Spanish cured meats","Grilled steak"],"creative":["Baked pasta with tomato sauce","Manchego and other aged sheep cheese"],"avoid":["Delicate white fish","Very spicy dishes"]},"kindred":["Rioja Crianza","Ribera del Duero","Texas Tempranillo (High Plains & Hill Country)"],"accent":"Rioja's oak-aged versions add vanilla, dill and cigar-box notes (especially with American oak), Ribera del Duero and Toro are darker, richer and grippier, Portugal uses it as Tinta Roriz/Aragonez in Douro, Dão and Alentejo blends, and newer regions such as Texas and Argentina make riper, fruitier styles.","summary":"Tempranillo is Spain's signature red, with cherry and plum fruit and savory notes of leather and tobacco. When aged in oak it picks up vanilla and dill, and it pairs naturally with lamb and Spanish cured meats.","sources":["https://winefolly.com/grapes/tempranillo/","https://www.jancisrobinson.com/learn/grape-varieties/red/tempranillo"],"confidence":"high"},{"country":"Various","group":"gp","id":"viognier","name":"Viognier (general)","aka":[],"grapes":["Viognier"],"region":"Mainly France (Rhône, Languedoc), USA (California, Virginia), Australia","style":"full","descriptors":["apricot","white peach","honeysuckle","orange blossom","mango","rose","oily","round"],"structure":{"sweetness":2,"acidity":2,"tannin":1,"alcohol":4,"body":4},"abv":"13.5-15%","window":{"from":0,"peak_start":0,"peak_end":2,"to":4,"top_to":8},"price":"$$","serve_f":"50-55","decant":"none","pairings":{"classic":["Chicken tagine with apricots","Seared scallops","Roast pork with stone fruit"],"creative":["Mild Thai yellow curry","Lobster rolls"],"avoid":["Tart vinaigrettes","Red-meat steaks"]},"kindred":["Condrieu","Virginia Viognier","Alsace Pinot Gris"],"accent":"Condrieu in France's northern Rhône is the perfumed, mineral benchmark, California (Paso Robles and elsewhere) tends to be lusher and riper, Virginia keeps a little more freshness for a rich-but-not-heavy style, and southern France and Australia offer lighter, unoaked, good-value versions.","summary":"Viognier is a rich, silky white that smells sweet, of apricot, peach and honeysuckle, but is usually dry. It has low acidity and a full, almost oily feel, and is best drunk young with fragrant dishes like apricot chicken or scallops.","sources":["https://winefolly.com/grapes/viognier/","https://www.decanter.com/wine/grape-varieties/viognier/","https://www.saveur.com/article/Wine-and-Drink/Tasting-Notes-Floral-Viognier/"],"confidence":"high"},{"country":"Various","group":"gp","id":"zinfandel","name":"Zinfandel (general)","aka":["Red Zinfandel","Primitivo","Tribidrag","Crljenak Kaštelanski"],"grapes":["Zinfandel"],"region":"Mainly California; also Puglia, Italy (as Primitivo)","style":"fred","descriptors":["blackberry","jammy","raspberry","black pepper","baking spice","tobacco","warm","plush"],"str       for (const q of [`${name} winery`, `${name} wine ${hint || ""}`.trim(), name]) {
        (await wpSearch(q, 3)).forEach(t => { if (!titles.includes(t)) titles.push(t); }); if (titles.length >= 5) break; }
      const sums = []; for (const t of titles.slice(0, 5)) { try { sums.push(await wpSummary(t)); } catch (e) {} }
      const nm = plain(name).split(/\s+/).filter(w => w.length > 2);
      sums.forEach(s => s.score = (WINEY.test(s.summary) ? 3 : 0) + 2 * nm.filter(w => plain(s.title + " " + s.summary.slice(0, 160)).includes(w)).length + (s.type === "disambiguation" ? -6 : 0));

async function onPhoto(file, back) {
  if (!file) return;
  if (!back && !(SNAP.barcode && !SNAP.img)) freshSnap();
  if (!back) { SNAP.aiFront = null; SNAP.aiBack = null; SNAP.aiInfo = null; }
  SNAP.busy = true; setStatus("Preparing photo…");
  const img = await shrink(file, 3200, .92), show = await shrink(file, 1000, .8);
  if (back) { SNAP.back = show; SNAP.aiBack = await shrink(file, 1400, .85); } else { SNAP.img = show; SNAP.thumb = await shrink(file, 180, .6); SNAP.aiFront = await shrink(file, 1400, .85); }
  viewSnap();
  if (AI.url) {
    try { setStatus(back ? "Reading the back label with AI…" : "Reading the label with AI (a few seconds)…");
      const j = await aiRead([SNAP.aiFront, SNAP.aiBack].filter(Boolean), "");
      applyAI(j);
      setStatus(SNAP.notWine ? "This doesn't look like a wine label. Try another photo, or fill in the fields." : `Read by AI${SNAP.aiConf === "low" ? " (it wasn't very sure, so please double-check)" : ""}. Check each field, fill in anything missing, then tap Find this wine.`);
      SNAP.busy = false; findWine(); return;
    } catch (e) { console.log(e); setStatus((e.message || "The AI reader isn't available") + " Using the on-device reader instead…"); }
  }
  try {
    if (!WORKER) setStatus("Loading the label reader (first time only)…");
    const lines = await readImage(img, back ? "back label" : "label"); if (back) lines.forEach(l => l.pass += 10);
    SNAP.lines = (SNAP.lines || []).concat(lines); SNAP.text = SNAP.lines.map(l => l.text).join("\n");
    applyExtract();
    setStatus(SNAP.lines.length ? "Here's what we could read. Check each field, fill in anything missing, then tap Find this wine." : "We couldn't read any words. Fill in the fields below.");
  } catch (e) { console.log(e); setStatus("The label reader couldn't load (are you offline?). Fill in the fields below."); }
  SNAP.busy = false; findWine();
}
function applyExtract() {
  const {f, found} = extract(SNAP.lines || []); SNAP.fields = SNAP.fields || {}; SNAP.found = SNAP.found || {}; SNAP.edited = SNAP.edited || new Set(); SNAP.src = SNAP.src || {};
  ["producer", "grape", "place", "vintage", "sweet", "color", "abv"].forEach(k => { if (SNAP.edited.has(k) || f[k] == null) return;
    if (["barcode", "remembered"].includes(SNAP.src[k]) && SNAP.fields[k]) return;
    SNAP.fields[k] = f[k]; SNAP.found[k] = !!found[k]; SNAP.src[k] = "label"; });
  SNAP.fields.placeAll = SNAP.edited.has("place") ? [SNAP.fields.place] : [...new Set([...(["barcode", "remembered"].includes(SNAP.src.place) ? [SNAP.fields.place] : []), ...(f.placeAll || [])])].filter(Boolean);
  SNAP.producers = [...new Set([...(SNAP.src.producer && SNAP.src.producer !== "label" ? [SNAP.fields.producer] : []), ...(f.producers || [])])];
}
function composed() {
  const F = SNAP.fields || {};
  return [F.grape, ...(SNAP.edited && SNAP.edited.has("place") ? [F.place] : (F.placeAll && F.placeAll.length ? F.placeAll : [F.place])), F.producer,
    F.sweet === "Sweet" ? "sweet" : F.sweet === "Dry" ? "dry" : F.sweet ? "semi-sweet" : "",
    F.color === "Rosé" ? "rosé" : F.color === "Sparkling" ? "sparkling" : F.color === "Red" && !F.grape ? "red" : ""].filter(Boolean).join("\n");
}
function findWine(fromForm) {

  let id = matchLabel(composed());
  if (!id) { SNAP.level = "style";
    id = F.color === "Rosé" ? "rose" : F.color === "Sparkling" ? "sparkling-wine" : F.color === "Red" && F.sweet && F.sweet !== "Dry" ? "sweet-red"

    if (id && !byId[id]) id = null; }
  SNAP.match = id; SNAP.vintage = F.vintage || null; SNAP.saved = false;
  if (id) { S.sel = {type: "wine", id}; S.vintage = SNAP.vintage; S.vintageFor = id; } else S.sel = null;
  render();
}

    if ((SNAP.fields[k] || "") !== (v || "")) { SNAP.edited.add(k); SNAP.fields[k] = v || null; SNAP.found[k] = false; if (SNAP.src) delete SNAP.src[k]; } });

                fields: {producer: F.producer, grape: F.grape, place: F.place, sweet: F.sweet, color: F.color, abv: F.abv}, level: SNAP.level,

  document.getElementById("bImport").onchange = async e => { try { const l = JSON.parse(await e.target.files[0].text()); if (Array.isArray(l)) { saveBottles(l); viewBottles(); } } catch (x) { alert("That file isn't a Cellar Lyceum backup."); } };
}
function go(v) { S.view = v; S.sel = null; render(); scrollTo({top: 0, behavior: "smooth"}); }
function viewHome() {
  const pg = document.getElementById("pageStage"); const bl = loadBottles(); const nCellar = bl.filter(b => b.cellar).reduce((s, b) => s + (b.qty || 0), 0);
  pg.innerHTML = `<div class="hero"><div class="k">Welcome</div><h2>What's in that bottle?</h2>
    <p>Welcome! Snap a photo of any wine label and find out what it is, what it tastes like, what to eat with it, and whether it's ready to open tonight or happier waiting a few more years.</p>
    <label class="bigbtn">📷 Snap a bottle<input type="file" accept="image/*" capture="environment" id="homeFile" hidden></label>
    <span class="alt" id="homeBc">or scan the barcode</span>
    <span class="alt" id="homeType">Or use your iPhone's Scan Text, or type the label</span></div>
    <div class="steps"><div><b>1 · Snap</b>Photograph the front label, straight on, in good light.</div>
      <div><b>2 · Discover</b>See tasting notes, food pairings, serving tips, and this vintage's best years.</div>
      <div><b>3 · Keep</b>Save it to My Bottles to build a simple cellar list that suggests what to open next.</div></div>
    ${bl.length ? `<div class="card" id="homeBottles"><div class="t">My Bottles</div><div class="d">${bl.length} saved scan${bl.length === 1 ? "" : "s"}${nCellar ? ` · ${nCellar} bottle${nCellar === 1 ? "" : "s"} in your cellar` : ""}. Tap to see what's ready to drink.</div></div>` : ""}
    <div class="homeh">Go deeper</div>
    <div class="cards">
      <div class="card" data-go="aroma"><div class="t">The Aroma Wheel</div><div class="d">Every word tasters use for smell and flavor, grouped into families. Tap any word for its meaning and the wines it describes.</div></div>
      <div class="card" data-go="together"><div class="t">Wines &amp; Words</div><div class="d">${DATA.wines.length} wine styles on one side, the tasting words on the other. Tap either to see the connections.</div></div>
      <div class="card" data-go="wines"><div class="t">Wine Wheel</div><div class="d">Wines arranged from crisp whites to big reds, linked to the ones that taste most alike. Great for "if you like this, try that."</div></div>
      <div class="card" data-go="words"><div class="t">Word Wheel</div><div class="d">Which flavors travel together? See the tasting words that keep turning up in the same glass.</div></div>
    </div>
    <p class="status" style="margin-top:16px">Everything here is free, needs no account, and keeps your saved bottles privately on this device. Wine profiles are drawn from reputable published sources and independently fact-checked.</p>`;
  document.getElementById("homeFile").onchange = e => { S.view = "snap"; render(); onPhoto(e.target.files[0]); };
  document.getElementById("homeBc").onclick = () => { go("snap"); openLiveScanner(); };
  document.getElementById("homeType").onclick = () => { go("snap"); setTimeout(scanTextHelp, 60); };
  const hb = document.getElementById("homeBottles"); if (hb) hb.onclick = () => go("bottles");
  pg.querySelectorAll("[data-go]").forEach(c => c.onclick = () => go(c.dataset.go));
}
function viewAroma() {
  const g = el("g", {}, svg); const n = TERMS.length, step = 360 / n; let a = -90;
  const selWord = S.sel && S.sel.type === "word" ? S.sel.id : null, selWine = S.sel && S.sel.type === "wine" ? byId[S.sel.id] : null;
  const lit = new Set(selWine ? selWine.descriptors : selWord ? [selWord] : []);
  const ts = fsz(n, 360, 205, 10.5); svg.setAttribute("viewBox", "-305 -305 610 610");
  DATA.families.forEach(f => {
    const span = step * f.terms.length, on = !lit.size || f.terms.some(t => lit.has(t));
    const fp = el("path", {d: arc(86, 195, a, a + span), fill: f.color, stroke: "#FBF7EE", "stroke-width": 2, opacity: on ? 1 : .35}, g);
    fp.style.cursor = "pointer"; fp.onclick = () => { S.sel = null; panelFamily(f); };
    const mid = a + span / 2, words = f.name.split(" & ");
    const lw = (r, d, t) => { const L = label(g, r, d, t, 9.5, "#fff", 700); L.setAttribute("text-anchor", "middle"); L.style.pointerEvents = "none";
      const dd = ((d % 360) + 360) % 360; if (dd > 90 && dd < 270) L.setAttribute("text-anchor", "middle"); };
    const md = ((mid % 360) + 360) % 360, fl = md > 90 && md < 270, dd = 3.4 * (fl ? -1 : 1);
    if (words.length === 2) { lw(140, mid - dd, words[0] + " &"); lw(140, mid + dd, words[1]); } else lw(140, mid, f.name);
    f.terms.forEach((t, i) => { const a0 = a + i * step, hot = lit.has(t);
      const p = el("path", {d: arc(198, 300, a0, a0 + step), fill: hot ? f.color : f.tint, stroke: "#FBF7EE", "stroke-width": .9, opacity: !lit.size || hot ? 1 : .45}, g);
      const L = label(g, 204, a0 + step / 2, t, ts, hot ? "#fff" : "#2B201A", hot ? 700 : 500);
      [p, L].forEach(x => { x.style.cursor = "pointer"; x.onclick = () => pick("word", t); });
      el("title", {}, p).textContent = t; });
    a += span; });
  el("circle", {r: 83, fill: "#6E1E2B"}, g);
  const c1 = el("text", {y: -6, "text-anchor": "middle", "font-family": "Cormorant SC", "font-size": 20, fill: "#F2E3C2"}, g); c1.textContent = selWine ? "" : "The Aroma";
  const c2 = el("text", {y: 16, "text-anchor": "middle", "font-family": "Cormorant SC", "font-size": 20, fill: "#F2E3C2"}, g); c2.textContent = selWine ? "" : "Wheel";
  if (selWine) { const t = el("text", {y: 4, "text-anchor": "middle", "font-family": "Cormorant SC", "font-size": 13, fill: "#F2E3C2"}, g); t.textContent = selWine.name.length > 22 ? selWine.name.slice(0, 21) + "…" : selWine.name; }
  setHint(selWine ? `The words lit up are how ${selWine.name} is described.` : "Start in the middle with a family, then move outward to the exact word. Tap any word for its meaning and the wines it describes.");
  legend(DATA.families.map(f => [f.color, f.name]));
}
function panelFamily(f) {
  panel.innerHTML = `<h2>${esc(f.name)}</h2><p>${f.terms.length} words in this family. Tap one to see what it means and which wines show it.</p>
   <div class="chips">${f.terms.map(t => `<span class="tchip" data-w="${esc(t)}" style="background:${f.color};color:#fff">${esc(t)}</span>`).join(" ")}</div>`;
  panel.querySelectorAll("[data-w]").forEach(x => { x.style.cursor = "pointer"; x.onclick = () => pick("word", x.dataset.w); });
}
function panelWelcome() {
  const picks = ["champagne-brut-nv", "napa-valley-cabernet-sauvignon", "sancerre", "barolo", "willamette-valley-pinot-noir", "marlborough-sauvignon-blanc", "rioja-reserva", "provence-rose"].filter(id => byId[id]);
  const w = byId[picks[new Date().getDate() % picks.length]] || DATA.wines[0];
  panel.innerHTML = `<div class="sec" style="margin-top:0">A wine to meet today</div><h2 style="cursor:pointer" id="wotd">${esc(w.name)}</h2><p>${esc(w.summary || "")}</p>
   <div class="row"><a href="#" id="wotd2">See the full profile →</a></div>
   <div class="sec">How to use this</div><div class="row">Start with <b>📷 Snap</b>. When you're curious, the <b>Explore</b> wheels show how wines and flavors connect.</div>
   <div class="row">Tip: on iPhone, open this page in Safari, tap Share, then <b>Add to Home Screen</b> to keep it like an app.</div>`;
  const op = e => { e && e.preventDefault(); pick("wine", w.id); }; document.getElementById("wotd").onclick = op; document.getElementById("wotd2").onclick = op;
}
function panelPageHome() {
  panel.innerHTML = S.view === "snap"
    ? `<h2>How Snap works</h2><p>1. Photograph the front label.<br>2. The page reads the text on your device.<br>3. It matches the label to the verified register and shows the full card, with this vintage's drinking window.</p>
       <div class="sec">Tips</div><div class="row">Shoot straight on, in good light. Fancy script fonts are hard to read; just type the key words (producer, region, year) if needed.</div>
       <div class="row">No match? Look the winery up on Wikipedia, or tap one of the closest styles.</div>`
    : `<h2>Your bottles</h2><p>Tap a bottle's name to open its card here, with its own drinking window.</p><div class="sec">Badges</div>
       <div class="row" style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(BADGE).map(([k, c]) => `<span class="vbadge" style="background:${c}">${k}</span>`).join("")}</div>
       <div class="row">Too Young → Ready → At Peak → Drink Soon → Past Peak, worked out from the vintage on the label.</div>`;
}

// ---------------- search
const q = document.getElementById("q"), sugg = document.getElementById("sugg"); let act = -1, items = [];
function doSearch() {
  const v = q.value.trim().toLowerCase(); if (!v) { sugg.style.display = "none"; return; }
  const ws = DATA.wines.filter(w => (w.name + " " + (w.grapes || []).join(" ") + " " + (w.region || "") + " " + (w.aka || []).join(" ")).toLowerCase().includes(v)).slice(0, 8).map(w => ["wine", w.id, w.name, (w.grapes || []).join(", ")]);
  const ts = TERMS.filter(t => t.includes(v)).slice(0, 6).map(t => ["word", t, t, termFam[t].name]);
  items = ws.concat(ts); act = -1;
  sugg.innerHTML = items.length ? items.map((it, i) => `<div data-i="${i}">${esc(it[2])}<small>${it[0] === "wine" ? "wine · " : "word · "}${esc(it[3])}</small></div>`).join("") : `<div class="empty">No match</div>`;
  sugg.style.display = "block";
}
q.addEventListener("input", doSearch);
q.addEventListener("keydown", e => { if (e.key === "ArrowDown") { act = Math.min(items.length - 1, act + 1); } else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); }
  else if (e.key === "Enter" && items.length) { choose(Math.max(0, act)); return; } else return;
  [...sugg.children].forEach((c, i) => c.classList.toggle("act", i === act)); e.preventDefault(); });
sugg.addEventListener("click", e => { const d = e.target.closest("[data-i]"); if (d) choose(+d.dataset.i); });
function choose(i) { const it = items[i]; sugg.style.display = "none"; q.value = ""; pick(it[0], it[1]); }
document.addEventListener("click", e => { if (!e.target.closest(".search")) sugg.style.display = "none"; });

// ---------------- start (restore from URL hash)
const AITEST = location.hash === "#aitest";
(function () { const h = decodeURIComponent(location.hash.slice(1)).split("/"); if (["home", "snap", "bottles", "aroma", "together", "wines", "words"].includes(h[0])) S.view = h[0];
  if (h[1]) { const [t, ...rest] = h[1].split(":"); const id = rest.join(":"); if ((t === "wine" && byId[id]) || (t === "word" && termFam[id])) S.sel = {type: t, id}; } })();
render();
if (AITEST) aiSelfTest();
</script>
