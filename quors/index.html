ican Pot-Still Rum"],"summary":"Baijiu is China's national grain spirit, most often made from sorghum fermented in solid form with a special grain starter. It is strong and intensely aromatic, from fruity and floral to deeply savory, and is drunk in toasts with food.","accent":"Solid-state qu fermentation creates high levels of esters and savory compounds unlike any Western grain spirit.","sources":["https://en.wikipedia.org/wiki/Baijiu","https://www.diffordsguide.com/beer-wine-spirits/category/719/baijiu-shaojiu"],"confidence":"medium"},{"id":"shochu","name":"Shochu","category":"other","aka":["honkaku shochu","otsurui shochu","imo-jochu (sweet potato)","mugi-jochu (barley)","kome-jochu (rice)"],"country":"Japan","region":"Kyushu (Kagoshima, Miyazaki, Kumamoto, Oita) and the Amami Islands","base":"sweet potato, barley, rice, buckwheat or brown sugar, with koji","production":"The base ingredient is fermented with koji and yeast and single-distilled in a pot still; most is rested in tanks and bottled around 25%, with some aged in oak or clay.","legal":"Japan Liquor Tax Act: honkaku (otsurui) shochu is single-distilled from permitted ingredients using koji, at no more than 45% ABV. Satsuma Shochu is a geographical indication: sweet potatoes and water from Kagoshima, pot-distilled and bottled there.","descriptors":["earth","cereal","toasted grain","floral","vegetal","mellow","smooth","light"],"structure":{"sweetness":1,"body":2,"heat":2,"smoke":1,"oak":1},"abv":"20-25% (up to 45%)","age":"mostly unaged; some aged in tanks, clay or oak","look":"crystal clear (oak-aged: pale gold)","finish":"medium","price":"$$","serve":["on the rocks","with hot water (oyuwari)","with cold water (mizuwari)","highball"],"glass":"rocks","cocktails":["Chuhai","Oolong-hai"],"food":{"classic":["kakuni (braised pork belly)","yakitori","sashimi"],"avoid":[]},"examples":["Iichiko","Kuro Kirishima","Satsuma Shiranami","Kannoko"],"kindred":["Soju","Baijiu","Grain Vodka"],"summary":"Shochu is Japan's native distilled spirit, made from sweet potato, barley, rice and other bases fermented with koji. It is usually low in alcohol and is enjoyed with ice, cold water or hot water alongside food.","accent":"Single distillation keeps the character of the base: earthy sweet potato, toasty barley or delicate rice.","sources":["https://www.hamadasyuzou.co.jp/en/faq/","https://japan-food.jetro.go.jp/shochu/assets/pdfs/2023/Japanese_SHOCHU_Guide_Brochure.pdf","https://www.gov-online.go.jp/en/assets/hj_march_2025_p22-23.pdf"],"confidence":"high"},{"id":"soju","name":"Soju","category":"other","aka":["diluted soju (green bottle)","distilled soju","Andong soju"],"country":"South Korea","region":"","base":"neutral spirit from tapioca, sweet potato or grains (mass-market); rice or other grains (traditional)","production":"Mass-market soju is high-strength neutral spirit diluted with water and sweeteners; traditional soju is fermented from rice or other grains and distilled, sometimes aged.","legal":"","descriptors":["light","sweet","crisp","smooth","cereal","mineral"],"structure":{"sweetness":2,"body":1,"heat":1,"smoke":1,"oak":1},"abv":"16-20% (green bottle); 25-45% traditional distilled","age":"","look":"crystal clear","finish":"short","price":"$","serve":["chilled shot","neat","with beer (somaek)","in cocktails"],"glass":"shot glass","cocktails":["Somaek","Poktan-ju"],"food":{"classic":["Korean barbecue","fried chicken","kimchi stew"],"avoid":[]},"examples":["Chamisul","Chum-Churum","Hwayo","Andong Soju"],"kindred":["Shochu","Grain Vodka","Baijiu"],"summary":"Soju is Korea's everyday spirit. The familiar green-bottle kind is a low-strength, lightly sweet, clean-tasting drink served chilled with food, while traditional distilled soju is stronger and has more grain and fruit character.","accent":"Far lower in alcohol than most spirits, and usually lightly sweetened and drunk with meals.","sources":["https://en.wikipedia.org/wiki/Soju","https://www.timeout.com/seoul/bars/soju-for-grown-ups-look"],"confidence":"medium"},{"id":"absinthe","name":"Absinthe","category":"other","aka":["la fée verte","absinthe verte","absinthe blanche","la bleue"],"country":"France and Switzerland (also USA, Czech Republic and elsewhere)","region":"Val-de-Travers (Switzerland), Pontarlier (France)","base":"neutral spirit with grand wormwood, green anise and Florence fennel","production":"Neutral spirit is macerated with wormwood, anise, fennel and other herbs and redistilled (clear blanche); a verte gets a second herb maceration for natural green color.","legal":"No EU or US standard of identity defines absinthe. US: TTB approves the word 'absinthe' only for 'thujone-free' products (under 10 ppm thujone, per FDA 21 CFR 172.510); it may not be the brand or fanciful name or stand alone on the label, and labels may not suggest hallucinogenic or mind-altering effects. EU: thujone is limited to 35 mg/kg in alcoholic beverages made from Artemisia species (10 mg/kg in other alcoholic beverages). 'Absinthe de Pontarlier' is an EU-registered geographical indication (2019).","descriptors":["anise","bitter herbs","fresh herbs","licorice","mint","floral","hot","oily"],"structure":{"sweetness":1,"body":3,"heat":5,"smoke":1,"oak":1},"abv":"45-74% (55-68% common)","age":"","look":"pale to peridot green (verte) or clear (blanche); turns milky (louche) with water","finish":"long","price":"$$-$$$","serve":["with iced water dripped over sugar","as a rinse in cocktails"],"glass":"absinthe glass","cocktails":["Sazerac","Corpse Reviver No. 2","Death in the Afternoon","Absinthe Frappé","Monkey Gland"],"food":{"classic":["olives","charcuterie","oysters"],"avoid":[]},"examples":["Pernod Absinthe","Kübler","Jade","St. George Absinthe Verte"],"kindred":["Anise Spirits (Pastis, Ouzo, Arak, Raki)","Sambuca","Chartreuse (Green & Yellow)"],"summary":"Absinthe is a very strong, unsweetened herbal spirit flavored with wormwood, anise and fennel. It is meant to be diluted with cold water, which turns it cloudy and opens up its aromas, and a few drops season many classic cocktails.","accent":"Wormwood bitterness and herbal complexity on top of anise, bottled stronger and drier than pastis or ouzo.","sources":["https://en.wikipedia.org/wiki/Absinthe","https://www.legislation.gov.uk/eur/2019/787/annexes/adopted"],"confidence":"high"},{"id":"pastis-ouzo-arak","name":"Anise Spirits (Pastis, Ouzo, Arak, Raki)","category":"other","aka":["pastis","ouzo","rakı","arak","anis"],"country":"France, Greece & Cyprus, Turkey, Lebanon and the Levant, Spain","region":"Mediterranean","base":"neutral or grape spirit flavored with aniseed and/or star anise (plus licorice root in pastis)","production":"Pastis is neutral spirit flavored with star anise and licorice root and lightly sweetened; ouzo, rakı and arak are redistilled with aniseed in copper pot stills, rakı and arak usually from a grape-spirit base.","legal":"EU 2019/787: aniseed-flavoured spirit drink at least 15% ABV; anis and distilled anis at least 35%; pastis at least 40% with natural licorice root extract (glycyrrhizic acid 0.05-0.5 g/L) and under 100 g/L sugar; pastis de Marseille at least 45%. Ouzo (GI, Greece and Cyprus only): at least 37.5% ABV, flavored with anise/star anise distillate from copper pot stills of up to 1,000 L, sugar at most 50 g/L. Turkish rakı (GI, 2009): made in Turkey, redistilled with aniseed in copper stills of up to 5,000 L, at least 65% of alcohol from grape spirit (suma), at least 40% ABV.","descriptors":["anise","licorice","fresh herbs","citrus botanicals","sweet","oily","smooth"],"structure":{"sweetness":2,"body":3,"heat":3,"smoke":1,"oak":1},"abv":"40-45% (pastis, ouzo, rakı); arak about 50-53%","age":"","look":"clear (pastis: yellowish amber); turns milky white with water","finish":"medium","price":"$-$$","serve":["with cold water and ice","diluted about 1:5 (pastis)","with meze"],"glass":"highball","cocktails":["Mauresque","Tomate","Perroquet"],"food":{"classic":["meze","grilled fish","olives"],"avoid":[]},"examples":["Ricard","Ouzo of Plomari","Yeni Rakı","Ksarak"],"kindred":["Absinthe","Sambuca","Aquavit"],"summary":"This family of Mediterranean spirits, including French pastis, Greek ouzo, Turkish rakı and Levantine arak, is built around aniseed. They are usually mixed with cold water, which turns them milky white, and sipped with small plates of food.","accent":"Anise first and foremost, without the wormwood bitterness of absinthe or the heavy sweetness of sambuca.","sources":["https://www.legislation.gov.uk/eur/2019/787/annexes/adopted","https://www.aade.gr/sites/default/files/2020-03/%CE%A4%CE%A6%201%CE%92%20tech_file_ouzo_mod_22_4_16_0.pdf","https://www.seaop.gr/en/spirits-and-distillates/ouzo/","https://en.wikipedia.org/wiki/Pastis","https://en.wikipedia.org/wiki/Rak%C4%B1","https://en.wikipedia.org/wiki/Arak_(drink)"],"confidence":"high"},{"id":"bitter-aperitivo","name":"Bitter Red Aperitivo (Campari style)","category":"liqueur","aka":["bitter","red bitter","bitter aperitivo"],"country":"Italy (made widely)","region":"Piedmont and Lombardy traditions","base":"neutral spirit infused with bitter herbs, roots, bark and citrus peel, sweetened","production":"Botanicals such as bitter orange, chinotto, cascarilla and gentian are infused in alcohol and water, sweetened and coloured red.","legal":"EU: a liqueur must be at least 15% ABV and contain at least 100 g/l sweetening (as invert sugar); or, where predominantly bitter, it may be sold as an EU 'bitter-tasting spirit drink' (min 15% ABV). US: a cordial/liqueur must contain at least 2.5% sugar by weight and may be called 'dry' only if under 10%.","descriptors":["orange peel","bitter herbs","gentian","cherry","grapefruit","bold","sweet"],"structure":{"sweetness":3,"body":2,"heat":2,"smoke":1,"oak":1},"abv":"20-28% (Campari 20.5-28.5% depending on market)","age":"","look":"vivid translucent red","finish":"long","price":"$$","serve":["with soda","in cocktails","on the rocks","in a spritz"], cchetti"],"avoid":[]},"examples":["Aperol","Contratto Aperitif"],"kindred":["Bitter Red Aperitivo (Campari style)","Orange Liqueur (Triple Sec, Cointreau style)","Quinquina & Aromatized Wine (Lillet, Cocchi Americano style)"],"summary":"A light, low-alcohol orange aperitivo with gentle bitterness, made famous by Aperol and the Aperol Spritz. It tastes of sweet orange and rhubarb with a soft bitter finish.","accent":"About half the strength of a Campari-style bitter and much sweeter and gentler.","sources":["https://en.wikipedia.org/wiki/Aperol","https://www.legislation.gov.uk/eur/2019/787/annex/I/adopted","https://www.law.cornell.edu/cfr/text/27/5.150"],"confidence":"medium"},{"id":"amaro","name":"Italian Amaro (Montenegro, Nonino, Averna style)","category":"liqueur","aka":["amari","amaro digestivo"],"country":"Italy","region":"","base":"herbs, roots, bark, flowers and citrus peel steeped in neutral spirit, grape spirit or wine","production":"Dozens of botanicals (often gentian, angelica, cinchona, citrus, licorice, saffron) are steeped in alcohol, sweetened with sugar or caramel, and sometimes rested in casks.","legal":"'Amaro' has no legal definition. EU: a liqueur must be at least 15% ABV and contain at least 100 g/l sweetening (as invert sugar) (only 80 g/l if flavoured solely with gentian, a similar plant or wormwood). US: a cordial/liqueur must contain at least 2.5% sugar by weight and may be called 'dry' only if under 10%.","descriptors":["bitter herbs","orange peel","caramel","gentian","licorice","baking spice","silky"],"structure":{"sweetness":4,"body":3,"heat":2,"smoke":1,"oak":2},"abv":"16-40% (most 23-35%)","age":"Sometimes rested in casks; no age categories","look":"amber to dark brown","finish":"long","price":"$$-$$$","serve":["neat","on the rocks","with a twist of citrus","in cocktails"],"glass":"rocks","cocktails":["Black Manhattan","Paper Plane","Amaro Spritz"],"food":{"classic":["after a rich meal","dark chocolate","biscotti"],"avoid":[]},"examples":["Amaro Montenegro","Averna","Amaro Nonino Quintessentia","Ramazzotti"],"kindred":["Fernet","German Herbal Liqueur (Jägermeister style)","Bitter Red Aperitivo (Campari style)"],"summary":"Amaro is Italy's family of bittersweet herbal liqueurs, sipped after dinner to aid digestion. Most taste of orange peel, caramel and herbs with a gentle bitter finish.","accent":"Sweeter and rounder than fernet, darker and more herbal than a red aperitivo bitter.","sources":["https://en.wikipedia.org/wiki/Amaro_(liqueur)","https://www.legislation.gov.uk/eur/2019/787/annex/I/adopted","https://www.law.cornell.edu/cfr/text/27/5.150"],"confidence":"medium"},{"id":"fernet","name":"Fernet","category":"liqueur","aka":["fernet amaro"],"country":"Italy (also Argentina, Czech Republic)","region":"Milan","base":"grape or neutral spirit infused with bitter herbs, roots and spices","production":"Botanicals such as myrrh, rhubarb, chamomile, cardamom, aloe, gentian and saffron are infused in spirit; the best-known example rests about a year in large oak vats.","legal":"'Fernet' has no legal definition; products are sold either as EU 'bitter-tasting spirit drinks' (min 15% ABV, predominantly bitter) or as liqueurs. US: sold as a cordial/liqueur or bitters.","descriptors":["bitter herbs","mint","licorice","gentian","earth","bold","dry"],"structure":{"sweetness":2,"body":3,"heat":4,"smoke":1,"oak":2},"abv":"35-45% (Fernet-Branca 39%)","age":"Fernet-Branca rests about 12 months in oak vats","look":"very dark brown, almost opaque","finish":"long","price":"$$","serve":["neat","chilled shot","with cola","with a ginger ale chaser"],"glass":"cordial","cocktails":["Toronto","Hanky Panky","Fernet con Coca","Fanciulli"],"food":{"classic":["after a heavy meal","espresso","dark chocolate"],"avoid":["delicate seafood"]},"examples":["Fernet-Branca","Fernet Vallet","Fernet Stock"],"kindred":["Italian Amaro (Montenegro, Nonino, Averna style)","German Herbal Liqueur (Jägermeister style)","Chartreuse (Green & Yellow)"],"summary":"Fernet is an intensely bitter, minty and medicinal style of amaro, strong in alcohol and only lightly sweet. It is famous as a bartender's shot and, in Argentina, mixed with cola.","accent":"The most bitter and least sweet of the amari, with a menthol-and-myrrh punch.","sources":["https://en.wikipedia.org/wiki/Fernet","https://www.diffordsguide.com/en-au/beer-wine-spirits/323/fernet-branca","https://www.legislation.gov.uk/eur/2019/787/annex/I/adopted"],"confidence":"high"},{"id":"chartreuse","name":"Chartreuse (Green & Yellow)","category":"liqueur","aka":["Green Chartreuse","Yellow Chartreuse","Chartreuse Verte","Chartreuse Jaune"],"country":"France","region":"Isère (Chartreuse Mountains)","base":"neutral spirit with about 130 herbs, plants and flowers","production":"Made to a secret recipe held by the Carthusian monks, who prepare the plant mixture; about 130 plants, barks, roots, spices and flowers are macerated and distilled, sweetened and aged for a long time in large oak vats; the colour comes from the plants.","legal":"'Chartreuse' is a brand of the Carthusian order, not a legal category. EU: a liqueur must be at least 15% ABV and contain at least 100 g/l sweetening (as invert sugar). US: a cordial/liqueur must contain at least 2.5% sugar by weight and may be called 'dry' only if under 10%.","descriptors":["fresh herbs","mint","honey","anise","black pepper","bold","viscous"],"structure":{"sweetness":4,"body":4,"heat":4,"smoke":1,"oak":2},"abv":"Green 55%; Yellow 43%","age":"Aged in oak casks; V.E.P. versions have extended ageing","look":"Green: vivid chartreuse green; Yellow: golden yellow","finish":"long","price":"$$$","serve":["neat","on the rocks","in cocktails","in hot chocolate"],"glass":"cordial","cocktails":["Last Word","Bijou","Chartreuse Swizzle","Naked and Famous","Cloister"],"food":{"classic":["after dinner","dark chocolate","Alpine cheeses"],"avoid":[]},"examples":["Green Chartreuse","Yellow Chartreuse","Chartreuse V.E.P."],"kindr   $("goTaste").onclick = () => go("taste"); $("goWheel").onclick = () => go("wheel");
  $("lq").oninput = e => { const q = plain(e.target.value); const r = q.length < 2 ? [] : SP.filter(s => plain([s.name, (s.aka || []).join(" "), s.region, s.country, (s.descriptors || []).join(" "), (s.examples || []).join(" ")].join(" ")).includes(q)).slice(0, 12);
    $("lres").innerHTML = r.map(s => `<div class="item" data-sp="${s.id}"><div class="ic">${I((CATS[s.category] || {}).icon)}</div><div><div class="n">${esc(s.name)}</div><div class="s">${esc((CATS[s.category] || {}).name || "")}</div></div></div>`).join("");
    $("lres").querySelectorAll("[data-sp]").forEach(b => b.onclick = () => go("spirit", {spirit: b.dataset.sp})); };
}

// ---- suggest a correction (same review list as cellar)
function showSuggest(id) {
  const s = byId[id], ov = document.createElement("div"); ov.className = "sheet";
  ov.innerHTML = `<div class="sheetin"><button class="btn" id="sgClose" style="float:right">Close</button><div class="kick">Help improve quors</div><h3>${esc(s ? s.name : "Suggest a fix")}</h3>
    <p class="status">Spotted something off? Every suggestion is fact-checked before anything changes, so please say where you learned it if you can.</p>
    <div class="fl">Your suggestion</div><textarea id="sgText" maxlength="1200"></textarea><div class="fl">Where did you learn it? (optional)</div><input type="text" id="sgSrc" maxlength="300">
    <p class="status" style="font-size:13px">Please don't include personal details.</p><button class="btn solid" id="sgSend">Send</button> <span class="status" id="sgMsg"></span></div>`;
  document.body.appendChild(ov); ov.onclick = e => { if (e.target === ov) ov.remove(); }; $("sgClose").onclick = () => ov.remove();
  $("sgSend").onclick = async () => { const t = $("sgText").value.trim(); if (t.length < 5) { $("sgMsg").textContent = "Please write a little more."; return; } $("sgMsg").textContent = "Sending…";
    try { await aiCall({task: "store_put", ns: "suggestions", key: "spirit:" + id, device: deviceId(), data: {app: "quors", wine: null, spirit: id, name: s ? s.name : "", area: "Spirits", text: t, source: $("sgSrc").value.trim(), at: new Date().toISOString()}}, "store_put");
      ov.querySelector(".sheetin").innerHTML = `<h3>Thank you</h3><p>Your suggestion is in the review list.</p><button class="btn solid" id="sgOk">Close</button>`; $("sgOk").onclick = () => ov.remove(); }
    catch (e) { $("sgMsg").textContent = "Couldn't send: " + e.message; } };
}
function showHelp() {
  const ov = document.createElement("div"); ov.className = "sheet";
  ov.innerHTML = `<div class="sheetin"><button class="btn" id="hClose" style="float:right">Close</button><div class="kick">Help</div><h3>Getting around quors</h3>
    <p><b>Scan</b> a bottle's label to identify the style and get notes. <b>Make</b> shows classic cocktails with exact recipes, and which ones your bar can make. <b>My bar</b> keeps what you own; it shares one backup code with cellar, so wine and spirits stay together. <b>Learn</b> covers every style, its legal rules and how to serve it.</p>
    <p class="status">quors is the spirits companion to <a href="../">cellar</a>. Please enjoy responsibly.</p></div>`;
  document.body.appendChild(ov); ov.onclick = e => { if (e.target === ov) ov.remove(); }; $("hClose").onclick = () => ov.remove();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => go(b.dataset.v, b.dataset.v === "learn" ? {cat: null} : {}));
$("wm").onclick = () => go("home"); $("helpBtn").onclick = showHelp;
S.view = (location.hash || "#home").slice(1).split("?")[0]; if (!["home", "scan", "make", "bar", "learn"].includes(S.view)) S.view = "home";
render();
setTimeout(() => { syncNow(); ensureBackup(); }, 800);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
