l Select"],"kindred":["Blended Irish Whiskey","American Rye Whiskey","Blended Scotch Whisky"],"summary":"Canadian whisky is usually a blend of separately distilled grains, typically a light corn or wheat base seasoned with rye. It's smooth and easygoing, with vanilla, caramel and a touch of spice.","accent":"Its blend-of-separately-aged-grains method makes it lighter and smoother than American rye, despite the 'rye' nickname.","sources":["https://laws.justice.gc.ca/eng/regulations/c.r.c.,_c._870/section-B.02.020-20060322.html","https://lois-laws.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-B.02.020-20241218.html","https://whiskyadvocate.com/canadian-whisky/"],"confidence":"medium"},{"id":"indian-single-malt","name":"Indian Single Malt Whisky","category":"whiskey","aka":["Indian malt"],"country":"India","region":"Bengaluru, Goa, Uttar Pradesh (Rampur), Haryana (Indri)","base":"malted barley (often Indian six-row barley)","production":"Pot-still single malt matured mainly in ex-bourbon casks plus sherry and wine casks; India's heat speeds wood interaction, with evaporation losses far above Scotland's.","legal":"FSSAI (Alcoholic Beverages) First Amendment Regulations 2023, in force 1 March 2024: 'single malt whisky' must be made from a fermented mash of malted barley without other grains, distilled in pot stills only, in a single distillery. No minimum age or cask rule was confirmed for this category.","descriptors":["tropical fruit","honey","dried apricot","baking spice","vanilla","toasted oak","rich","bold"],"structure":{"sweetness":3,"body":4,"heat":3,"smoke":2,"oak":4},"abv":"46-50% (cask strength 55-62%)","age":"NAS dominant (typically 3-6 years of maturation)","look":"amber to deep amber","finish":"medium-long","price":"$$-$$$","serve":["neat","with a few drops of water","on the rocks"],"glass":"Glencairn","cocktails":["Old Fashioned","Penicillin","Highball"],"food":{"classic":["tandoori chicken","lamb biryani","dark chocolate"],"avoid":[]},"examples":["Amrut Fusion","Paul John Brilliance","Rampur Double Cask","Indri Trini"],"kindred":["Taiwanese Single Malt Whisky","Sherry-Cask Single Malt Scotch","Speyside Single Malt Scotch"],"summary":"Indian single malts are made from malted barley in pot stills and aged in India's hot climate, which pulls flavor from the barrel quickly. The result is rich, fruity and spicy whisky that tastes older than its years.","accent":"Tropical heat gives young malts unusual depth of fruit and oak; distinct from India's mass-market 'whisky', which is mostly molasses-based.","sources":["https://www.whiskyadvocate.com/india-whisky-hotspot/","https://thewhiskeywash.com/whiskey-articles/a-quick-beginners-guide-to-amrut-paul-john-rampur-and-indri/","https://www.federvini.it/en/news-en/india-introduces-new-definitions-for-single-malt-and-single-grain-whiskey,-and-imposes-mandate-on-alcohol-label-information","https://www.foodnavigator.com/Article/2023/09/19/india-launches-strict-standards-for-high-value-whiskey-to-cut-labelling-adulteration/"],"confidence":"medium"},{"id":"taiwanese-single-malt","name":"Taiwanese Single Malt Whisky","category":"whiskey","aka":["Taiwan whisky"],"country":"Taiwan","region":"Yilan (Kavalan), Nantou (Omar)","base":"malted barley (largely imported)","production":"Pot-still single malt matured in a hot, humid subtropical climate that accelerates maturation; known for ex-bourbon, sherry, wine barrique and STR (shaved, toasted, re-charred) casks.","legal":"Enforcement Rules of the Tobacco and Alcohol Administration Act, Art. 3(5)(2): whisky is a distilled spirit made from grain by saccharification, fermentation and distillation, matured in wooden casks for at least 2 years, with at least 40% ABV. 'Single malt' is not separately defined in Taiwanese law.","descriptors":["tropical fruit","vanilla","honey","dried apricot","coconut","toasted oak","creamy","rich"],"structure":{"sweetness":3,"body":4,"heat":3,"smoke":1,"oak":4},"abv":"40-46% (single-cask releases 55-60%)","age":"NAS dominant (typically 3-6 years)","look":"amber to deep mahogany (sherry casks)","finish":"medium-long","price":"$$-$$$$","serve":["neat","with a few drops of water","on the rocks"],"glass":"Glencairn","cocktails":["Old Fashioned","Highball","Rob Roy"],"food":{"classic":["mango desserts","pineapple cake","roast duck"],"avoid":[]},"examples":["Kavalan Classic Single Malt","Kavalan Solist Vinho Barrique","Omar Bourbon Cask"],"kindred":["Indian Single Malt Whisky","Sherry-Cask Single Malt Scotch","Japanese Single Malt Whisky"],"summary":"Taiwan's single malts, led by Kavalan, mature quickly in subtropical heat, so a few years in the barrel gives deep flavor. Expect lush tropical fruit, vanilla and creamy oak.","accent":"Extreme heat and high evaporation (about 10-15% a year) produce dense, fruity, oak-rich malts at young ages.","sources":["https://distiller.com/articles/taiwanese-whisky","https://en.wikipedia.org/wiki/Taiwanese_whisky"],"confidence":"medium"},{"id":"tequila-blanco","name":"Tequila Blanco","category":"agave","aka":["Tequila Plata","Silver Tequila"],"country":"Mexico","region":"Jalisco (Tequila DO)","base":"blue Weber agave","production":"Agave hearts are cooked (stone ovens or autoclaves), crushed, fermented and distilled at least twice, usually in pot or column stills; bottled unaged or after a brief rest.","legal":"Made under NOM-006 within the Tequila denomination of origin (all of Jalisco plus designated municipalities in Guanajuato, Michoacán, Nayarit and Tamaulipas) from Agave tequilana Weber, blue variety. Plain 'tequila' (mixto) needs at least 51% of its sugars from agave; only all-agave tequila may say '100% agave'. Mexican rules allow 35-55% ABV. Blanco (plata) is unaged or rested for less than two months.","descriptors":["cooked agave","green agave","black pepper","lemon","vegetal","mineral","crisp","bold"],"structure":{"sweetness":2,"body":2,"heat":3,"smoke":1,"oak":1},"abv":"38-46% (40% common in the US)","age":"","look":"crystal clear","finish":"medium","price":"$-$$","serve":["in cocktails","neat","on the rocks","chilled shot"],"glass":"rocks","cocktails":["Margarita","Paloma","Tommy's Margarita","Tequila Sunrise"],"food":{"classic":["tacos al pastor","ceviche","guacamole"],"avoid":[]},"examples":["Fortaleza Blanco","Tequila Ocho Plata","El Tesoro Blanco","Espolòn Blanco"],"kindred":["Mezcal (Espadín)","Raicilla","Bacanora"],"summary":"Blanco is tequila in its purest form, bottled with little or no time in wood. It tastes of sweet cooked agave, pepper and citrus and is the classic choice for Margaritas.","accent":"With no barrel influence, blanco shows the agave itself more plainly than any aged tequila.","sources":["https://en.wikipedia.org/wiki/Tequila","https://crt.org.mx/wp-content/uploads/2024/01/NOM006%20INGLES%20TEQUILA%20LABELING%20REGULATIONS.pdf"],"confidence":"high"},{"id":"tequila-reposado","name":"Tequila Reposado","category":"agave","aka":["Rested Tequila","Aged Tequila (export term)"],"country":"Mexico","region":"Jalisco (Tequila DO)","base":"blue Weber agave","production":"Distilled like blanco, then rested in oak (often ex-bourbon American oak barrels or larger casks) for a few months to under a year.","legal":"Made under NOM-006 within the Tequila denomination of origin (all of Jalisco plus designated municipalities in Guanajuato, Michoacán, Nayarit and Tamaulipas) from Agave tequilana Weber, blue variety. Plain 'tequila' (mixto) needs at least 51% of its sugars from agave; only all-agave tequila may say '100% agave'. Mexican rules allow 35-55% ABV. Reposado must rest at least two months in oak; tequila aged a year or more qualifies as añejo instead.","descriptors":["cooked agave","vanilla","caramel","black pepper","toasted oak","cinnamon","smooth","mellow"],"structure":{"sweetness":2,"body":3,"heat":3,"smoke":1,"oak":2},"abv":"38-46% (40% common in the US)","age":"2-11 months in oak","look":"pale straw to light gold","finish":"medium","price":"$$","serve":["neat","on the rocks","in cocktails"],"glass":"rocks","cocktails":["Margarita","Paloma","El Diablo","Rosita"],"food":{"classic":["carnitas","enchiladas","grilled chicken"],"avoid":[]},"examples":["Fortaleza Reposado","Siete Leguas Reposado","Cazadores Reposado"],"kindred":["Tequila Blanco","Tequila Añejo","Cristalino Tequila"],"summary":"Reposado means 'rested': tequila that has spent a few months in oak barrels. It keeps the agave character of blanco but picks up soft vanilla and caramel from the wood.","accent":"It sits between blanco and añejo, with the agave still in front and the oak only seasoning it.","sources":["https://australianbartender.com.au/?p=52082","https://en.wikipedia.org/wiki/Tequila","https://crt.org.mx/wp-content/uploads/2024/01/NOM006%20INGLES%20TEQUILA%20LABELING%20REGULATIONS.pdf"],"confidence":"high"},{"id":"tequila-anejo","name":"Tequila Añejo","category":"agave","aka":["Extra-Aged Tequila (export term)"],"country":"Mexico","region":"Jalisco (Tequila DO)","base":"blue Weber agave","production":"Aged one to three years in small oak barrels, most often ex-bourbon American oak, sometimes French oak or wine casks.","legal":"Made under NOM-006 within the Tequila denomination of origin (all of Jalisco plus designated municipalities in Guanajuato, Michoacán, Nayarit and Tamaulipas) from Agave tequilana Weber, blue variety. Plain 'tequila' (mixto) needs at least 51% of its sugars from agave; only all-agave tequila may say '100% agave'. Mexican rules allow 35-55% ABV. Añejo must age at least one year in oak containers of no more than 600 litres; after three years it can be labeled extra añejo.","descriptors":["caramel","vanilla","cooked agave","toasted oak","butterscotch","baking spice","rich","smooth"],"structure":{"sweetness":3,"body":4,"heat":2,"smoke":1,"oak":4},"abv":"38-43% (40% common in the US)","age":"1-3 years in oak","look":"amber","finish":"medium-long","price":"$$-$$$","serve":["neat","on the rocks","with a few drops of water"],"glass":"snifter","cocktails":["Añejo Old Fashioned","Tequila Manhattan"],"food":{"classic":["mole","braised short ribs","dark chocolate"],"avoid":["delicate raw seafood"]},"examples":["Don Julio Añejo","El Tesoro Añejo","Tequila Ocho Añejo"],"kindred":["Tequila Extra Añejo","Tequila Reposado","Aged & Dark Rum"],"summary":"Añejo is tequila aged at least a year in small oak barrels, which gives it an amber color and flavors of caramel, vanilla and spice. It is usually sipped like a whiskey.","accent":"Here the barrel and the agave are roughly in balance, which makes añejo the usual bridge for whiskey drinkers.","sources":["https://australianbartender.com.au/?p=52082","https://www.mezcalistas.com/?p=84396","https://en.wikipedia.org/wiki/Tequila"],"confidence":"high"},{"id":"tequila-extra-anejo","name":"Tequila Extra Añejo","category":"agave","aka":["Ultra-Aged Tequila (export term)"],"country":"Mexico","region":"Jalisco (Tequila DO)","base":"blue Weber agave","production":"Aged three years or more in small oak barrels, sometimes finished in sherry, wine or cognac casks.","legal":"Made under NOM-006 within the Tequila denomination of origin (all of Jalisco plus designated municipalities in Guanajuato, Michoacán, Nayarit and Tamaulipas) from Agave tequilana Weber, blue variety. Plain 'tequila' (mixto) needs at least 51% of its sugars from agave; only all-agave tequila may say '100% agave'. Mexican rules allow 35-55% ABV. Extra añejo, a category added in 2006, must age at least three years in oak containers of no more than 600 litres.","descriptors":["toasted oak","caramel","dried apricot","vanilla","cooked agave","chocolate","silky","long"],"structure":{"sweetness":3,"body":4,"heat":2,"smoke":1,"oak":5},"abv":"40-43%","age":"3+ years in oak (3-5 years typical)","look":"deep amber to mahogany","finish":"long","price":"$$$-$$$$","serve":["neat","with a few drops of water"],"glass":"snifter","cocktails":["Añejo Old Fashioned"],"food":{"classic":["dark chocolate","flan","aged cheeses"],"avoid":["spicy salsas"]},"examples":["El Tesoro Paradiso","Herradura Selección Suprema","José Cuervo Reserva de la Familia Extra Añejo"],"kindred":["Tequila Añejo","Cognac XO","Aged & Dark Rum"],"summary":"Extra añejo is tequila aged at least three years in oak, making it the oldest and usually priciest tequila category. It is a sipping spirit with deep oak, dried fruit and caramel notes.","accent":"Long aging pushes the oak ahead of the agave, so it can resemble an aged brandy or rum more than a young tequila.","sources":["https://australianbartender.com.au/?p=52082","https://www.mezcalistas.com/?p=84396","https://en.wikipedia.org/wiki/Tequila"],"confidence":"high"},{"id":"tequila-cristalino","name":"Cristalino Tequila","category":"agave","aka":["Cristalino","Añejo Cristalino","Añejo Claro"],"country":"Mexico","region":"Jalisco (Tequila DO)","base":"blue Weber agave","production":"An aged tequila (usually añejo) is filtered, typically through activated charcoal, to strip the barrel color; a few producers redistill instead.","legal":"Made under NOM-006 within the Tequila denomination of origin (all of Jalisco plus designated municipalities in Guanajuato, Michoacán, Nayarit and Tamaulipas) from Agave tequilana Weber, blue variety. Plain 'tequila' (mixto) needs at least 51% of its sugars from agave; only all-agave tequila may say '100% agave'. Mexican rules allow 35-55% ABV. 'Cristalino' is not a legal category or class of tequila under NOM-006 or the CRT; it is a marketing term for aged tequila filtered clear. The CRT permits these products, but the name itself is not defined.","descriptors":["vanilla","cooked agave","caramel","coconut","sweet","smooth","light"],"structure":{"sweetness":3,"body":2,"heat":2,"smoke":1,"oak":2},"abv":"35-40%","age":"made from aged tequila, most often añejo (1+ years)","look":"crystal clear","finish":"short","price":"$$-$$$","serve":["on the rocks","neat","chilled shot","highball"],"glass":"rocks","cocktails":["Paloma","Margarita"],"food":{"classic":["fish tacos","fresh fruit","churros"],"avoid":[]},"examples":["Don Julio 70","Maestro Dobel Diamante","Herradura Ultra"],"kindred":["Tequila Añejo","Tequila Reposado","Tequila Blanco"],"summary":"Cristalino is aged tequila that has been filtered until it is clear again, aiming for the smoothness of añejo with the look of blanco. It is usually soft, sweet-leaning and easy to drink over ice.","accent":"It is the only tequila style defined by removing color rather than by agave or age, and it is not an official category.","sources":["https://www.mezcalistas.com/cristalino/","https://crt.org.mx/wp-content/uploads/2024/01/NOM006%20INGLES%20TEQUILA%20LABELING%20REGULATIONS.pdf"],"confidence":"high"},{"id":"mezcal-espadin","name":"Mezcal (Espadín)","category":"agave","aka":["Mezcal","Mezcal Espadín","Agave angustifolia mezcal"],"country":"Mexico","region":"Oaxaca (mezcal DO)","base":"espadín agave (Agave angustifolia), mostly cultivated","production":"Agave hearts are roasted in earthen pit ovens, crushed by tahona or mallet, fermented in open vats and distilled in small copper or clay stills; most is bottled unaged.","legal":"Under NOM-070-SCFI-2016, mezcal must be made only from agave within the mezcal denomination of origin (Oaxaca and several other states). There are three types: 'mezcal' (industrial methods such as autoclaves and column stills allowed), 'mezcal artesanal' (traditional methods) and 'mezcal ancestral' (pit-oven cooking, hand or tahona milling, clay-pot stills). Classes include joven/blanco, reposado (2-12 months in wood), añejo (12+ months in wood) and madurado en vidrio (12+ months in glass).","descriptors":["cooked agave","wood smoke","earth","black pepper","citrus botanicals","mineral","oily","bold"],"structure":{"sweetness":2,"body":3,"heat":3,"smoke":3,"oak":1},"abv":"40-50%","age":"usually unaged (joven)","look":"crystal clear","finish":"medium-long","price":"$$-$$$","serve":["neat","in cocktails"],"glass":"copita","cocktails":["Mezcal Negroni","Oaxaca Old Fashioned","Naked and Famous","Mezcal Margarita"],"food":{"classic":["orange slices with sal de gusano","mole negro","grilled meats"],"avoid":[]},"examples":["Del Maguey Vida","Montelobos Espadín","Mezcal Vago Espadín"],"kindred":["Tequila Blanco","Wild-Agave & Ancestral Mezcal (Tobalá, Tepeztate…)","Islay Peated Single Malt Scotch"],"summary":"Mezcal is Mexico's broader family of agave spirits, and espadín is the agave behind most of it. Roasting the agave in earthen pits gives it a smoky, earthy edge over the sweetness of cooked agave.","accent":"Pit roasting gives mezcal its smoke, which tequila's steam-cooked agave lacks.","sources":["https://www.normasoficiales.mx/nom/nom-070-scfi-2016","https://www.diffordsguide.com/bws/1264/mezcal/categories","https://www.mezcalistas.com/what-is-ancestral-mezcal/"],"confidence":"high"},{"id":"mezcal-wild-agave","name":"Wild-Agave & Ancestral Mezcal (Tobalá, Tepeztate…)","category":"agave","aka":["Mezcal Silvestre","Mezcal Ancestral","Tobalá","Tepeztate"],"country":"Mexico","region":"Oaxaca and other mezcal DO states","base":"wild or semi-wild agaves such as tobalá (Agave potatorum) and tepeztate (Agave marmorata)","production":"Small-batch, from agaves that can take a decade or more to mature; ancestral bottlings use pit ovens, hand or tahona milling and clay-pot stills, and are usually bottled at full strength and unaged.","legal":"Under NOM-070-SCFI-2016, mezcal must be made only from agave within the mezcal denomination of origin (Oaxaca and several other states). There are three types: 'mezcal' (industrial methods such as autoclaves and column stills allowed), 'mezcal artesanal' (traditional methods) and 'mezcal ancestral' (pit-oven cooking, hand or tahona milling, clay-pot stills). Classes include joven/blanco, reposado (2-12 months in wood), añejo (12+ months in wood) and madurado en vidrio (12+ months in glass). 'Ancestral' on the label requires pit-oven cooking, mallet or tahona milling and distillation in clay pot stills.","descriptors":["floral","mineral","vegetal","earth","tropical fruit","wood smoke","oily","long"],"structure":{"sweetness":2,"body":3,"heat":4,"smoke":2,"oak":1},"abv":"45-55%","age":"usually unaged (joven)","look":"crystal clear","finish":"long","price":"$$$-$$$$","serve":["neat"],"glass":"copita","cocktails":[],"food":{"classic":["orange slices with sal de gusano","tlayudas","fresh cheese"],"avoid":["sweet desserts"]},"examples":["Del Maguey Tobala","Rey Campero Tepextate","Real Minero"],"kindred":["Mezcal (Espadín)","Raicilla","Sotol"],"summary":"These mezcals come from wild agave species that take many years to grow, often made by the oldest hand methods. Each species tastes different, from floral and fruity tobalá to green, mineral tepeztate.","accent":"The agave species and village matter more here than in any other agave spirit, and smoke is often lighter than in espadín.","sources":["https://www.mezcalistas.com/what-is-ancestral-mezcal/","https://www.normasoficiales.mx/nom/nom-070-scfi-2016","https://www.diffordsguide.com/bws/1264/mezcal/categories"],"confidence":"medium"},{"id":"raicilla","name":"Raicilla","category":"agave","aka":["Raicilla de la Sierra","Raicilla de la Costa"],"country":"Mexico","region":"Western Jalisco & Nayarit","base":"local agaves such as Agave maximiliana, A. inaequidens (sierra) and A. angustifolia, A. rhodacantha (coast)","production":"Agave is roasted in pits or brick ovens, fermented in open wooden vats and distilled in small copper or clay stills; mountain and coastal styles differ.","legal":"Raicilla received a denomination of origin in 2019 (declaration published 28 June 2019), covering 16 municipalities in Jalisco and one in Nayarit (Bahía de Banderas). A draft official standard (PROY-NOM-257-SE-2021) was published but no final NOM had been issued as of the sources consulted, so production rules such as ABV and aging classes are not yet fixed in law.","descriptors":["fermented fruit","green agave","floral","mineral","earth","tropical fruit","bold","dry"],"structure":{"sweetness":2,"body":2,"heat":4,"smoke":2,"oak":1},"abv":"40-50%","age":"usually unaged","look":"crystal clear","finish":"medium-long","price":"$$-$$$","serve":["neat"],"glass":"copita","cocktails":[],"food":{"classic":["aguachile","grilled fish","fresh fruit with chile"],"avoid":[]},"examples":["La Venenosa","Estancia Raicilla"],"kindred":["Wild-Agave & Ancestral Mezcal (Tobalá, Tepeztate…)","Mezcal (Espadín)","Bacanora"],"summary":"Raicilla is a rustic agave spirit from the mountains and coast near Puerto Vallarta in Jalisco. It is often funkier, fruitier and less smoky than mezcal.","accent":"It comes from Jalisco but from different agaves and older methods than tequila, often with a wild, fermented-fruit edge.","sources":["https://spiritsselection.com/en/raicilla-jaliscos-other-agave-spirit-with-do/","https://www.mezcalistas.com/?p=84396"],"confidence":"medium"},{"id":"bacanora","name":"Bacanora","category":"agave","aka":[],"country":"Mexico","region":"Sonora","base":"Agave angustifolia (local 'pacifica' or 'yaquiana' forms), wild or cultivated","production":"Agave is usually roasted in pit ovens, shredded, fermented and distilled twice; modern equipment is also permitted.","legal":"Denomination of origin since 2000, covering 35 municipalities in eastern Sonora. NOM-168-SCFI-2004 requires 100% Agave angustifolia grown in the DO, bottling within the DO and 38-55% ABV. Classes include blanco, joven/oro, reposado (2+ months in oak) and añejo (1+ year in oak barrels of up to 200 litres).","descriptors":["cooked agave","mineral","earth","black pepper","grassy","wood smoke","crisp","dry"],"structure":{"sweetness":2,"body":2,"heat":3,"smoke":2,"oak":1},"abv":"40-50%","age":"usually unaged","look":"crystal clear","finish":"medium","price":"$$-$$$","serve":["neat","in cocktails"],"glass":"copita","cocktails":[],"food":{"classic":["carne asada","machaca","queso fresco"],"avoid":[]},"examples":["Rancho Tepúa","Sunora Bacanora"],"kindred":["Mezcal (Espadín)","Sotol","Raicilla"],"summary":"Bacanora is the agave spirit of Sonora in northern Mexico, made from the same species as most mezcal. It is usually cleaner and more mineral than Oaxacan mezcal, with gentle smoke.","accent":"It shares mezcal's agave but comes from the desert north, where it was banned for most of the 20th century.","sources":["https://www.mezcalistas.com/what-is-bacanora/","https://www.mezcalistas.com/?p=84396"],"confidence":"medium"},{"id":"sotol","name":"Sotol","category":"agave","aka":["Desert Spoon spirit","Texas Sotol (outside the DO)"],"country":"Mexico","region":"Chihuahua, Coahuila, Durango","base":"sotol / desert spoon (Dasylirion spp.), not an agave","production":"Wild plants are harvested, the hearts cooked (traditionally in pits), crushed, fermented and usually distilled twice; larger producers may use ovens, autoclaves and column stills.","legal":"Not an agave spirit: it is made from Dasylirion. Mexican denomination of origin since 2002 for Chihuahua, Coahuila and Durango, governed by NOM-159-SCFI-2004. Añejo sotol must age at least a year in containers of 210 litres or less. The US does not recognize the DO, so 'Texas sotol' is also sold.","descriptors":["vegetal","earth","mineral","fresh herbs","grassy","black pepper","crisp","light"],"structure":{"sweetness":2,"body":2,"heat":3,"smoke":2,"oak":1},"abv":"38-50%","age":"usually unaged; reposado and añejo exist","look":"crystal clear","finish":"medium","price":"$$","serve":["neat","in cocktails"],"glass":"copita","cocktails":[],"food":{"classic":["grilled meats","green chile dishes","queso asadero"],"avoid":[]},"examples":["Hacienda de Chihuahua","Por Siempre","Desert Door (Texas)"],"kindred":["Bacanora","Mezcal (Espadín)","Wild-Agave & Ancestral Mezcal (Tobalá, Tepeztate…)"],"summary":"Sotol tastes like a cousin of mezcal but is made from the desert spoon plant, not agave. It often has green, herbal, piney or mineral notes depending on where the plants grow.","accent":"It is the only spirit here made from a non-agave desert plant, giving it a greener, more resinous profile.","sources":["https://www.mezcalistas.com/what-is-sotol","https://www.mezcalistas.com/?p=84396"],"confidence":"medium"},{"id":"jamaican-rum","name":"Jamaican Pot-Still Rum","category":"rum","aka":["Jamaica Rum","Funky Jamaican rum"],"country":"Jamaica","region":"","base":"molasses","production":"Long fermentations, at some distilleries with dunder (spent wash) and muck, build high ester levels; distilled in copper double-retort pot stills, often blended with column rum.","legal":"Jamaica Rum has been a protected geographical indication since 2016. It must use naturally filtered limestone water from the defined region, Saccharomyces yeasts only, copper pot stills or column stills with copper rectifiers, and be aged in Jamaica; colour may come only from oak aging or cane-sugar caramel. 2024 amendments (including a ban on aging overseas) were suspended by Jamaica's Supreme Court in September 2025 pending a full hearing.","descriptors":["hogo","banana","overripe fruit","tropical fruit","solvent","molasses","bold","oily"],"structure":{"sweetness":2,"body":4,"heat":4,"smoke":1,"oak":2},"abv":"40-63% (overproof whites around 63%)","age":"unaged to 12+ years; many blends 2-8 years","look":"clear (white) to deep amber","finish":"long","price":"$$-$$$","serve":["in cocktails","neat","on the rocks"],"glass":"rocks","cocktails":["Mai Tai","Daiquiri","Planter's Punch","Jungle Bird"],"food":{"classic":["jerk chicken","curry goat","grilled pineapple"],"avoid":["delicate white fish"]},"examples":["Smith & Cross","Appleton Estate 12","Hampden Estate 8"],"kindred":["Navy & Overproof Rum","Demerara Rum (Guyana)","Barbados Rum"],"summary":"Jamaican rum is famous for its 'funk': bold aromas of overripe banana, pineapple and fermented fruit from long fermentations and pot stills. It adds depth to tiki drinks and stands up well on its own.","accent":"High ester levels make it the most aromatic, pungent molasses rum, with a fruity funk known as hogo.","sources":["https://cocktailwonk.com/2018/08/unabridged-jamaican-rum-geographical-indication.html","https://cocktailwonk.com/2016/03/days-of-dunder-setting-the-record-straight-on-jamaican-rums-mystery-ingredient.html","https://en.wikipedia.org/wiki/Rum"],"confidence":"high"},{"id":"demerara-rum","name":"Demerara Rum (Guyana)","category":"rum","aka":["Demerara","Guyanese rum","El Dorado-style rum"],"country":"Guyana","region":"Demerara River","base":"molasses (Demerara sugar)","production":"Produced at Diamond Distillery (Demerara Distillers Ltd.), which still runs historic wooden pot and wooden Coffey stills alongside metal ones; heavy marques are blended and aged in oak.","legal":"","descriptors":["molasses","brown sugar","dark fruit","coffee","leather","toffee","rich","viscous"],"structure":{"sweetness":3,"body":5,"heat":3,"smoke":2,"oak":3},"abv":"40-43% (blends); higher for single-still and navy bottlings","age":"3-25 years; 12 and 15 years common","look":"deep amber to mahogany","finish":"long","price":"$$-$$$","serve":["neat","on the rocks","in cocktails"],"glass":"snifter","cocktails":["Zombie","Navy Grog","Rum Old Fashioned"],"food":{"classic":["pepperpot stew","sticky toffee pudding","dark chocolate"],"avoid":[]},"examples":["El Dorado 12","El Dorado 15","El Dorado Port Mourant single still"],"kindred":["Navy & Overproof Rum","Aged & Dark Rum","Jamaican Pot-Still Rum"],"summary":"Demerara rum from Guyana is rich and heavy, with deep molasses, dried fruit and coffee flavors. Much of its character comes from one distillery's rare wooden stills.","accent":"Its heavy, dark-sugar profile and wooden stills set it apart, and it formed the backbone of historic British Navy rum.","sources":["https://www.diffordsguide.com/en-au/producers/2/diamond-distillery-demerara-distillers-ltd/history","https://rumx.com/en/blog/navy-rum-everything-you-need-to-know/","https://en.wikipedia.org/wiki/Rum"],"confidence":"medium"},{"id":"spanish-style-rum","name":"Spanish-Style Light Rum (Cuba, Puerto Rico, Dominican Republic)","category":"rum","aka":["Ron","White rum","Ron blanco","Silver rum"],"country":"Cuba, Puerto Rico, Dominican Republic","region":"Spanish-speaking Caribbean","base":"molasses","production":"Short fermentation and distillation to high strength in multi-column stills, followed by aging in oak and often charcoal filtration to a clear, light spirit.","legal":"No single rule covers the style. Puerto Rico law requires rum to be aged at least one year in oak. Ron Dominicano received a denomination of origin in November 2021, requiring Dominican sugarcane and at least 12 months of uninterrupted aging. Cuban rules were not confirmed.","descriptors":["light","vanilla","sugarcane","lemon","coconut","banana","crisp","dry"],"structure":{"sweetness":2,"body":1,"heat":2,"smoke":1,"oak":1},"abv":"37.5-40%","age":"often 1-3 years, then filtered clear","look":"crystal clear to pale straw","finish":"short","price":"$-$$","serve":["in cocktails","highball","on the rocks"],"glass":"highball","cocktails":["Daiquiri","Mojito","Cuba Libre","Piña Colada","El Presidente"],"food":{"classic":["Cuban sandwich","fried plantains","ceviche"],"avoid":[]},"examples":["Bacardí Superior","Havana Club 3 Años","Don Q Cristal","Brugal Extra Dry"],"kindred":["Barbados Rum","Rhum Agricole (Martinique)","Cachaça"],"summary":"This is the clean, light rum behind the Daiquiri and Mojito. It is column-distilled and lightly aged, then usually filtered clear for a soft, mixable spirit.","accent":"It is the lightest and most neutral rum style, built for mixing rather than funk or richness.","sources":["https://en.wikipedia.org/wiki/Rum","https://rumcapital.pr.gov/history","https://revistamercado.do/empresas/fiesta-dominicana-el-ron-recibe-denominacion-de-origen/"],"confidence":"medium"},{"id":"barbados-rum","name":"Barbados Rum","category":"rum","aka":["Bajan rum"],"country":"Barbados","region":"","base":"molasses","production":"Usually a blend of copper pot-still and column-still rums, aged in ex-bourbon barrels and sometimes finished in wine or spirit casks.","legal":"A Barbados Rum geographical indication has been proposed (all production and bottling on the island, sugarcane-only base, no added sugar or flavouring, caramel colour allowed within limits) but had not been finalised at the time of the sources consulted.","descriptors":["vanilla","banana","toasted oak","coconut","honey","baking spice","smooth","mellow"],"structure":{"sweetness":2,"body":3,"heat":3,"smoke":1,"oak":3},"abv":"40-46%","age":"2-15 years; 5-12 common","look":"gold to amber","finish":"medium-long","price":"$$-$$$","serve":["neat","on the rocks","in cocktails"],"glass":"rocks","cocktails":["Rum Punch","Corn 'n' Oil","Daiquiri","Rum Old Fashioned"],"food":{"classic":["flying fish","fish cakes","banana bread"],"avoid":[]},"examples":["Mount Gay Eclipse","R.L. Seale's 10","Doorly's XO"],"kindred":["Jamaican Pot-Still Rum","Spanish-Style Light Rum (Cuba, Puerto Rico, Dominican Republic)","Aged & Dark Rum"],"summary":"Barbados rum is a balanced, elegant style that blends pot and column rums and ages them in oak. It is fruity and lightly spiced without the heavy funk of Jamaican rum.","accent":"It sits in the middle of the rum spectrum, richer than Spanish-style rum but cleaner than Jamaican.","sources":["https://thefatrumpirate.com/geographic-indications-gis-the-barbados-rum-gi-explained","https://en.wikipedia.org/wiki/Rum","https://rumx.com/en/blog/navy-rum-everything-you-need-to-know/"],"confidence":"medium"},{"id":"rhum-agricole","name":"Rhum Agricole (Martinique)","category":"rum","aka":["AOC Rhum de la Martinique","Agricole","Rhum"],"country":"Martinique (France)","region":"Martinique","base":"fresh sugarcane juice","production":"Fresh cane juice is fermented in open vats and distilled in a single-column (Creole) still to 65-75% ABV, then rested as blanc or aged in oak.","legal":"AOC Rhum de la Martinique: fresh cane juice only (no syrup or molasses), cane harvested 1 January to 31 August, batch fermentation in open vats of at most 500 hl for at most 120 hours, continuous multi-plate column distillation with reflux to 65-75% ABV, sold at 40%+ ABV. Blanc must mature at least 6 weeks in vats; élevé sous bois needs 12+ months in oak; vieux needs 3+ years in oak casks under 650 L (VO 3+, VSOP 4+, XO/hors d'âge 6+). EU rules reserve 'agricole' for cane-juice rums from French overseas departments and Madeira.","descriptors":["grassy","sugarcane","vegetal","green apple","black pepper","floral","crisp","dry"],"structure":{"sweetness":1,"body":2,"heat":4,"smoke":1,"oak":1},"abv":"40-55% (blancs often 50-55%)","age":"blanc unaged; élevé sous bois 1+ yr; vieux 3+ yrs","look":"crystal clear (blanc) to amber (vieux)","finish":"medium-long","price":"$$-$$$","serve":["in cocktails","neat"],"glass":"rocks","cocktails":["Ti' Punch","Daiquiri","Mai Tai"],"food":{"classic":["accras (salt-cod fritters)","Creole fish stew","grilled shrimp"],"avoid":[]},"examples":["Rhum J.M Blanc","Rhum Clément","Neisson Blanc","La Favorite"],"kindred":["Cachaça","Spanish-Style Light Rum (Cuba, Puerto Rico, Dominican Republic)","Tequila Blanco"],"summary":"Rhum agricole is made from fresh-pressed sugarcane juice rather than molasses, under France's strict AOC rules in Martinique. It tastes grassy, green and peppery, more like the cane field than the sugar bowl.","accent":"Fresh cane juice and a protected AOC give it a vegetal, dry character unlike molasses-based rums.","sources":["https://extranet.inao.gouv.fr/fichier/CDCaoc-RhumdelaMartinique-cn200903.pdf","https://legislation.gov.uk/eur/2019/787/annexes/adopted","https://gotrum.com/the-rum-university/rhum-agricole"],"confidence":"high"},{"id":"cachaca","name":"Cachaça","category":"rum","aka":["Pinga","Aguardente de cana"],"country":"Brazil","region":"","base":"sugarcane juice","production":"Fresh cane juice is fermented and distilled either in copper pot stills (alambique, artisanal) or columns (industrial); sold unaged or aged in oak or native Brazilian woods such as amburana.","legal":"Brazilian law defines cachaça as the cane spirit produced in Brazil by distilling fermented sugarcane juice, bottled at 38-48% ABV (at 20°C), with up to 6 g/L of added sugar; 6-30 g/L must be labeled 'adoçada' (sweetened). In the US it is classed as a type of rum and must be bottled at 40%+ to use the name.","descriptors":["sugarcane","grassy","vegetal","banana","green apple","fermented fruit","crisp","light"],"structure":{"sweetness":2,"body":2,"heat":3,"smoke":1,"oak":1},"abv":"38-48% (40% common in the US)","age":"mostly unaged; aged versions 1-3+ years in casks of 700 L or less","look":"crystal clear (prata) to gold (ouro/envelhecida)","finish":"medium","price":"$-$$","serve":["in cocktails","neat","on the rocks"],"glass":"rocks","cocktails":["Caipirinha","Batida","Rabo de Galo"],"food":{"classic":["feijoada","pão de queijo","grilled picanha"],"avoid":[]},"examples":["Novo Fogo","Avuá","Leblon","Ypióca"],"kindred":["Rhum Agricole (Martinique)","Spanish-Style Light Rum (Cuba, Puerto Rico, Dominican Republic)"],"summary":"Cachaça is Brazil's national spirit, distilled from fresh sugarcane juice and best known in the Caipirinha. Unaged versions are fresh, grassy and fruity; aged ones can take on unusual flavors from native Brazilian woods.","accent":"Like agricole it starts from fresh cane juice, but Brazil's lower bottling strength and native-wood aging give it its own identity.","sources":["https://www.govinfo.gov/content/pkg/FR-2013-02-25/html/2013-04242.htm","https://en.wikipedia.org/wiki/Cacha%C3%A7a"],"confidence":"high"},{"id":"spiced-rum","name":"Spiced Rum","category":"rum","aka":["Spiced spirit drink"],"country":"Various (Caribbean, US, UK)","region":"","base":"molasses","production":"Usually light column-still rum, sometimes with pot-still or aged rum, infused or flavored with spices and vanilla, typically sweetened and colored with caramel.","legal":"Because EU and UK rules forbid flavouring rum, spiced rums there are sold as 'spirit drinks'; many brands avoid the word rum on the label. No universal legal definition of spiced rum was confirmed.","descriptors":["vanilla","cinnamon","clove","nutmeg","caramel","brown sugar","sweet","smooth"],"structure":{"sweetness":4,"body":3,"heat":2,"smoke":1,"oak":1},"abv":"30-47% (35-40% common)","age":"usually unaged or lightly aged; color mostly from spices and caramel","look":"gold to dark amber","finish":"medium","price":"$-$$","serve":["highball","on the rocks","in cocktails"],"glass":"highball","cocktails":["Cuba Libre","Hot Buttered Rum","Rum Punch"],"food":{"classic":["barbecue ribs","pumpkin pie","banana fritters"],"avoid":["delicate seafood"]},"examples":["Captain Morgan Original Spiced","Sailor Jerry","The Kraken","Chairman's Reserve Spiced"],"kindred":["Aged & Dark Rum","Falernum","Navy & Overproof Rum"],"summary":"Spiced rum is rum flavored with vanilla and warm spices like cinnamon and clove, and usually sweetened. It is easy-going and most often mixed with cola or ginger beer.","accent":"Its flavor comes mainly from added spices and sugar rather than from the rum or the barrel.","sources":["https://www.diffordsguide.com/beer-wine-spirits/category/917/spiced-rums/spirit-drinks","https://legislation.gov.uk/eur/2019/787/annexes/adopted"],"confidence":"high"},{"id":"aged-dark-rum","name":"Aged & Dark Rum","category":"rum","aka":["Dark rum","Black rum","Añejo rum","Gold rum","Sipping rum"],"country":"Various","region":"Caribbean & Latin America","base":"molasses","production":"Pot, column or blended rums aged in oak (mostly ex-bourbon barrels); 'dark' and 'black' rums often get extra color and molasses notes from caramel, while some Latin American sipping rums are sweetened or solera-blended.","legal":"No universal rules for 'dark' or 'aged'; the terms are loosely regulated. EU and UK rules (Regulation 2019/787): rum must be distilled from fermented sugarcane products, bottled at 37.5%+ ABV, not flavoured, and contain no more than 20 g/L of sweetening; caramel is allowed only to adjust colour. Age statements and minimum aging depend on each country's rules.","descriptors":["molasses","caramel","toffee","vanilla","toasted oak","raisin","rich","warming"],"structure":{"sweetness":3,"body":4,"heat":2,"smoke":1,"oak":3},"abv":"40-46%","age":"3-25 years; NAS common for dark rums","look":"amber to near-black","finish":"medium-long","price":"$$-$$$","serve":["neat","on the rocks","in cocktails"],"glass":"snifter","cocktails":["Dark 'n' Stormy","Rum Old Fashioned","Hot Buttered Rum","Mai Tai"],"food":{"classic":["crème brûlée","barbecue pork","cigars and dark chocolate"],"avoid":[]},"examples":["Gosling's Black Seal","Appleton Estate 8","Ron Zacapa 23","Diplomático Reserva Exclusiva"],"kindred":["Demerara Rum (Guyana)","Tequila Añejo","Bourbon (Kentucky straight)"],"summary":"Aged and dark rums have spent years in oak barrels or been deepened with caramel, giving them flavors of molasses, toffee and dried fruit. They are good for sipping and for richer cocktails.","accent":"It is a catch-all defined by color and age rather than place, so sweetness and style range widely.","sources":["https://en.wikipedia.org/wiki/Rum","https://legislation.gov.uk/eur/2019/787/annexes/adopted"],"confidence":"medium"},{"id":"navy-rum","name":"Navy & Overproof Rum","category":"rum","aka":["Navy Strength Rum","Overproof rum","Pusser's style"],"country":"Various (British Caribbean blends)","region":"Guyana, Jamaica, Trinidad, Barbados","base":"molasses","production":"Traditionally a blend of dark, heavy molasses rums from former British colonies (Demerara-heavy), bottled at high strength; overproof whites, often Jamaican, are bottled unaged at around 63%.","legal":"No legal definition of navy rum or 'navy strength' was confirmed; both are style terms. The Royal Navy's daily rum ration ended on 31 July 1970 (Black Tot Day).","descriptors":["molasses","dark fruit","brown sugar","leather","coffee","hogo","bold","hot"],"structure":{"sweetness":3,"body":5,"heat":5,"smoke":2,"oak":3},"abv":"54.5-57% (navy strength); 60-75% for overproof whites","age":"NAS blends common","look":"dark amber to mahogany (navy); clear (overproof whites)","finish":"long","price":"$$-$$$","serve":["in cocktails","with a few drops of water","on the rocks"],"glass":"rocks","cocktails":["Painkiller","Navy Grog","Zombie","Grog"],"food":{"classic":["fruitcake","spiced ham","sticky toffee pudding"],"avoid":["delicate dishes"]},"examples":["Pusser's Gunpowder Proof","Black Tot","Wray & Nephew White Overproof"],"kindred":["Demerara Rum (Guyana)","Jamaican Pot-Still Rum","Navy-Strength Gin"],"summary":"Navy rum recalls the rich, strong blends once issued daily to British sailors, and overproof rums are bottled well above normal strength. Both bring bold flavor and serious heat, so they are mostly used in small amounts in cocktails.","accent":"High strength plus a dark, heavy blend give it more punch and concentration than any standard rum.","sources":["https://rumx.com/en/blog/navy-rum-everything-you-need-to-know/","https://en.wikipedia.org/wiki/Rum"],"confidence":"medium"},{"id":"cognac-vs","name":"Cognac VS","category":"brandy","aka":["Very Special","Three Star (***)","Sélection","De Luxe"],"country":"France","region":"Cognac (Charente & Charente-Maritime)","base":"grapes (mainly Ugni Blanc)","production":"Thin, acidic white wine is double-distilled in copper Charentais pot stills and aged in French oak casks; VS blends are the youngest, liveliest cognacs.","legal":"Cognac AOC: white wine from approved grapes (chiefly Ugni Blanc; also Colombard, Folle Blanche and others) grown in the delimited Cognac region; double (batch) distillation in a copper Charentais alembic, finished by 31 March after the harvest; aged only in oak, at least 2 years before sale; minimum 40% ABV. Age categories refer to the youngest eau-de-vie in the blend. Caramel colouring, oak-chip infusion (boisé) and limited sweetening are permitted. VS / Three Star: youngest eau-de-vie at least 2 years old.","descriptors":["orange peel","stone fruit","pear","vanilla","floral","toasted oak","warming","light"],"structure":{"sweetness":2,"body":2,"heat":3,"smoke":1,"oak":2},"abv":"40%","age":"2+ years (youngest eau-de-vie); blends often 2-4 years","look":"pale gold to light amber","finish":"medium","price":"$$","serve":["in cocktails","highball","on the rocks","neat"],"glass":"snifter","cocktails":["Sidecar","Brandy Crusta","Between the Sheets","Japanese Cocktail","Vieux Carré"],"food":{"classic":["pâté","roast chicken","dark chocolate"],"avoid":[]},"examples":["Hennessy Very Special","Courvoisier VS","Pierre Ferrand 1840 Original Formula"],"kindred":["Cognac VSOP","Armagnac","American Brandy"],"summary":"Cognac VS is the youngest grade of France's most famous grape brandy, aged at least two years in oak. It is fruity and fresh with a light touch of vanilla and wood, which makes it a natural cocktail brandy.","accent":"Brighter and more fruit-forward than VSOP or XO, with oak in a supporting role rather than in charge.","sources":["https://www.cognac.fr/en/a-protected-origin/","https://extranet.inao.gouv.fr/fichier/Cahier-des-charges-Cognac---PNO.pdf","https://www.decanter.com/spirits/cognac/cognac-ageing-gracefully-447730/","https://en.wikipedia.org/wiki/Cognac","https://www.diffordsguide.com/encyclopedia/1001/bws/cognac-quality-age-classifications"],"confidence":"high"},{"id":"cognac-vsop","name":"Cognac VSOP","category":"brandy","aka":["Very Superior Old Pale","Réserve","VO","Vieux"],"country":"France","region":"Cognac (Charente & Charente-Maritime)","base":"grapes (mainly Ugni Blanc)","production":"Double-distilled in copper Charentais pot stills, then aged longer in French oak so that dried-fruit and spice notes join the fresh fruit.","legal":"Cognac AOC: white wine from approved grapes (chiefly Ugni Blanc; also Colombard, Folle Blanche and others) grown in the delimited Cognac region; double (batch) distillation in a copper Charentais alembic, finished by 31 March after the harvest; aged only in oak, at least 2 years before sale; minimum 40% ABV. Age categories refer to the youngest eau-de-vie in the blend. Caramel colouring, oak-chip infusion (boisé) and limited sweetening are permitted. VSOP / Réserve: youngest eau-de-vie at least 4 years old.","descriptors":["dried apricot","vanilla","orange peel","toasted oak","honey","baking spice","smooth","mellow"],"structure":{"sweetness":2,"body":3,"heat":2,"smoke":1,"oak":3},"abv":"40%","age":"4+ years (youngest eau-de-vie); blends often 4-10 years","look":"amber","finish":"medium-long","price":"$$-$$$","serve":["neat","on the rocks","in cocktails"],"glass":"snifter","cocktails":["Sidecar","Vieux Carré","Sazerac","Champs-Élysées"],"food":{"classic":["roast duck","mushroom dishes","dark chocolate"],"avoid":[]},"examples":["Rémy Martin VSOP","Hennessy VSOP Privilège","Martell VSOP","Courvoisier VSOP"],"kindred":["Cognac VS","Cognac XO","Armagnac"],"summary":"Cognac VSOP has spent at least four years in oak, so it tastes rounder and richer than VS. It works both as a sipping brandy and in spirit-forward cocktails.","accent":"The middle grade: still fruity like VS, but with noticeably more oak, spice and dried fruit, at a far lower price than XO.","sources":["https://www.cognac.fr/en/a-protected-origin/","https://extranet.inao.gouv.fr/fichier/Cahier-des-charges-Cognac---PNO.pdf","https://www.decanter.com/spirits/cognac/cognac-ageing-gracefully-447730/","https://en.wikipedia.org/wiki/Cognac","https://www.diffordsguide.com/encyclopedia/1001/bws/cognac-quality-age-classifications"],"confidence":"high"},{"id":"cognac-xo","name":"Cognac XO","category":"brandy","aka":["Extra Old","Hors d'Âge","Extra"],"country":"France","region":"Cognac (Charente & Charente-Maritime)","base":"grapes (mainly Ugni Blanc)","production":"Blends of long-aged, double-distilled eaux-de-vie matured in French oak, often for decades, and assembled by a cellar master.","legal":"Cognac AOC: white wine from approved grapes (chiefly Ugni Blanc; also Colombard, Folle Blanche and others) grown in the delimited Cognac region; double (batch) distillation in a copper Charentais alembic, finished by 31 March after the harvest; aged only in oak, at least 2 years before sale; minimum 40% ABV. Age categories refer to the youngest eau-de-vie in the blend. Caramel colouring, oak-chip infusion (boisé) and limited sweetening are permitted. XO / Hors d'Âge: youngest eau-de-vie at least 10 years old (raised from 6 years, effective 2018); Napoléon remains 6 years; XXO (Extra Extra Old) at least 14 years.","descriptors":["dried apricot","fig","leather","toasted oak","baking spice","chocolate","rich","silky"],"structure":{"sweetness":2,"body":4,"heat":2,"smoke":1,"oak":4},"abv":"40-46%","age":"10+ years (youngest eau-de-vie) since 2018; many blends far older","look":"deep amber to mahogany","finish":"long","price":"$$$$","serve":["neat","with a few drops of water"],"glass":"snifter","cocktails":["Sazerac","Vieux Carré","Sidecar"],"food":{"classic":["dark chocolate","aged Comté","foie gras"],"avoid":["very spicy food"]},"examples":["Hennessy XO","Rémy Martin XO","Martell XO","Courvoisier XO"],"kindred":["Cognac VSOP","Armagnac","Brandy de Jerez"],"summary":"Cognac XO is the long-aged top tier of cognac, with every brandy in the blend at least ten years old. It is meant for slow sipping and tastes of dried fruit, spice, leather and polished wood.","accent":"Long oak aging brings out the savory, nutty 'rancio' depth that younger cognacs lack.","sources":["https://www.cognac.fr/en/a-protected-origin/","https://extranet.inao.gouv.fr/fichier/Cahier-des-charges-Cognac---PNO.pdf","https://www.decanter.com/spirits/cognac/cognac-ageing-gracefully-447730/","https://en.wikipedia.org/wiki/Cognac","https://www.diffordsguide.com/encyclopedia/1001/bws/cognac-quality-age-classifications"],"confidence":"high"},{"id":"armagnac","name":"Armagnac","category":"brandy","aka":["Bas-Armagnac","Armagnac-Ténarèze","Haut-Armagnac","Blanche Armagnac"],"country":"France","region":"Gascony (Gers, Landes, Lot-et-Garonne)","base":"grapes (Ugni Blanc, Baco Blanc, Colombard, Folle Blanche and others)","production":"Usually distilled once in a copper column 'alambic armagnacais' heated by open flame (double pot distillation is also allowed), then aged in oak, often bottled with little reduction.","legal":"Armagnac AOC: ten authorized white grapes (chiefly Ugni Blanc, Baco Blanc, Colombard, Folle Blanche); continuous armagnacais column or double pot distillation, completed by 31 March after the harvest; minimum 40% ABV; at least 1 year in oak. Ages refer to the youngest eau-de-vie: VS / *** at least 1 year, VSOP at least 4, Napoléon at least 6, XO and Hors d'Âge at least 10 (XO raised from 6 to 10 years for blends bottled from 1 April 2018); vintages come from one harvest and age at least 10 years. Blanche Armagnac is an unaged AOC that rests at least 3 months in inert containers. Three zones: Bas-Armagnac, Armagnac-Ténarèze, Haut-Armagnac.","descriptors":["prune","dried apricot","toasted oak","leather","toffee","baking spice","bold","rich"],"structure":{"sweetness":2,"body":4,"heat":3,"smoke":1,"oak":4},"abv":"40-48% (cask-strength vintages higher)","age":"VS 1+, VSOP 4+, Napoléon 6+, XO/Hors d'Âge 10+ years; vintage-dated bottlings common","look":"amber to deep mahogany","finish":"long","price":"$$-$$$","serve":["neat","with a few drops of water","in cocktails"],"glass":"snifter","cocktails":["Sidecar","Brandy Alexander","Vieux Carré"],"food":{"classic":["foie gras with prunes","duck confit","dark chocolate"],"avoid":[]},"examples":["Château de Laubade","Domaine Tariquet","Darroze","Delord"],"kindred":["Cognac XO","Cognac VSOP","Calvados"],"summary":"Armagnac is a Gascon grape brandy, usually distilled just once, which leaves it more robust and characterful than cognac. Many are sold as single-vintage bottlings from small family estates.","accent":"Single column distillation at low strength gives a rustic, fuller-flavored brandy than double-distilled cognac.","sources":["https://extranet.inao.gouv.fr/fichier/2-CDC-PNO-Armagnac-.pdf","https://www.thedrinksbusiness.com/2018/04/armagnac-xo-age-requirement-increased-to-10-years/","https://en.wikipedia.org/wiki/Armagnac","https://www.armagnac.fr/en/magazine/understanding-a-label/456/0/4"],"confidence":"high"},{"id":"calvados","name":"Calvados","category":"brandy","aka":["Calva","Calvados Pays d'Auge","Calvados Domfrontais"],"country":"France","region":"Normandy (and adjoining areas)","base":"cider apples, with perry pears","production":"Cider (and perry) is fermented, then distilled in column stills or, for Pays d'Auge, double-distilled in pot stills, and aged in oak.","legal":"Three AOCs, all at least 40% ABV when sold. AOC Calvados: cider (with perry pears) distilled in pot stills or multi-column stills (no rectification), at least 2 years in oak. Calvados Pays d'Auge: no more than 30% perry pears, double distillation in pot stills (à repasse), at least 2 years in oak. Calvados Domfrontais: at least 30% perry pears, column still, at least 3 years in oak. Age terms refer to the youngest component: VS / Trois étoiles / Trois pommes 2 years; Vieux / Réserve 3; VO / Vieille Réserve / VSOP 4; XO / Hors d'Âge / Très Vieille Réserve / Très Vieux / Extra / Napoléon 6.","descriptors":["baked apple","green apple","pear","toasted oak","vanilla","baking spice","smooth","crisp"],"structure":{"sweetness":2,"body":3,"heat":3,"smoke":1,"oak":3},"abv":"40-42%","age":"VS 2+, Vieux/Réserve 3+, VSOP 4+, XO/Hors d'Âge 6+ years","look":"gold to deep amber","finish":"medium-long","price":"$$-$$$","serve":["neat","in cocktails","as a 'trou normand' between courses"],"glass":"snifter","cocktails":["Corpse Reviver No. 1","Widow's Kiss","Jack Rose","Star Cocktail"],"food":{"classic":["Camembert","tarte Tatin","pork with apples"],"avoid":[]},"examples":["Christian Drouin","Boulard","Père Magloire","Roger Groult"],"kindred":["Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)","American Brandy","Cognac VSOP"],"summary":"Calvados is Normandy's apple brandy, distilled from cider and aged in oak. Young bottles taste of fresh crisp apples; older ones taste like baked apple, spice and toffee.","accent":"Apple (and pear) instead of grape gives an orchard-fruit core no grape brandy has.","sources":["https://www.inao.gouv.fr/node/6199/printable/pdf","https://www.inao.gouv.fr/node/6200/printable/pdf","https://en.wikipedia.org/wiki/Calvados","https://thewhiskyphiles.com/calvadosuk/what-is-calvados/","https://www.bkwine.com/news/calvados-making-progress/"],"confidence":"high"},{"id":"brandy-de-jerez","name":"Brandy de Jerez","category":"brandy","aka":["Spanish brandy","Solera Reserva","Solera Gran Reserva"],"country":"Spain","region":"Jerez, Andalusia (Sherry Triangle)","base":"grapes (wine spirits)","production":"Grape spirits (low-strength 'holandas' plus higher-strength distillate) are aged in roughly 500-litre American oak casks seasoned with sherry, using the criaderas y soleras system.","legal":"GI Brandy de Jerez: at least 36% ABV; aged and bottled exclusively in Jerez de la Frontera, El Puerto de Santa María and Sanlúcar de Barrameda, in oak casks under 1,000 litres previously seasoned with sherry, by criaderas y soleras (or static añadas); low- and medium-strength wine spirits (holandas, under 86% ABV) must supply more than 50% of the alcohol; total sugars at most 35 g/L. Average aging must exceed: Solera 6 months, Solera Reserva 1 year, Solera Gran Reserva 3 years; age-qualified Solera 12, 15, 18 and 30 years and vintage 'de Añada' (over 12 years, unblended) also exist.","descriptors":["sherried fruit","raisin","caramel","toasted oak","nutty","vanilla","rich","sweet"],"structure":{"sweetness":3,"body":4,"heat":2,"smoke":1,"oak":4},"abv":"36-40%","age":"Solera 6+ months, Reserva 1+ year, Gran Reserva 3+ years (average); top Gran Reservas much older","look":"deep amber to mahogany","finish":"medium-long","price":"$-$$$","serve":["neat","on the rocks","with coffee","in cocktails"],"glass":"snifter","cocktails":["Carajillo","Brandy Alexander","Sidecar"],"food":{"classic":["Manchego","almond turrón","dark chocolate"],"avoid":[]},"examples":["Cardenal Mendoza","Lepanto","Fundador","Gran Duque d'Alba"],"kindred":["Cognac XO","Sherry-Cask Single Malt Scotch","Armagnac"],"summary":"Brandy de Jerez is Spanish grape brandy aged in old sherry casks in the town of Jerez and its neighbors. It is typically round, sweet-seeming and raisiny, with a nutty sherry character.","accent":"Solera aging in ex-sherry casks makes it richer, darker and sweeter-tasting than French brandies of similar age.","sources":["https://en.wikipedia.org/wiki/Brandy_de_Jerez","https://www.legislation.gov.uk/eur/2019/787/annexes/adopted"],"confidence":"high"},{"id":"pisco-peru","name":"Peruvian Pisco","category":"brandy","aka":["Pisco Perú","Pisco Puro","Acholado","Mosto Verde"],"country":"Peru","region":"Coastal valleys of Lima, Ica, Arequipa, Moquegua and Tacna","base":"grapes (eight pisco varieties, e.g. Quebranta, Italia)","production":"Freshly fermented grape wine is distilled once in copper pot stills straight to bottling strength, then rested in inert vessels; it never sees oak.","legal":"Peruvian DO: only eight grapes (non-aromatic Quebranta, Negra Criolla, Mollar, Uvina; aromatic Italia, Moscatel, Torontel, Albilla) from designated coastal valleys; natural fermentation without added sugar; single distillation; nothing, including water, may be added after distillation, so it is bottled at still strength (38-48% ABV); rested at least 3 months in vessels that do not alter it (glass, steel, ceramic), no wood. Styles: Puro (one variety), Acholado (blend), Mosto Verde (from partially fermented must). US labeling: 'Pisco Perú'.","descriptors":["green apple","floral","grassy","banana","stone fruit","nutty","crisp","dry"],"structure":{"sweetness":1,"body":2,"heat":3,"smoke":1,"oak":1},"abv":"38-48% (41-43% common)","age":"unaged (rested 3+ months)","look":"crystal clear","finish":"medium","price":"$-$$","serve":["in cocktails","neat","highball"],"glass":"copita","cocktails":["Pisco Sour","Pisco Punch","Chilcano","Capitán"],"food":{"classic":["ceviche","tiradito","fried calamari"],"avoid":[]},"examples":["Pisco Portón","Barsol","Macchu Pisco","La Diablada"],"kindred":["Chilean Pisco","Grappa","Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)"],"summary":"Peruvian pisco is an unaged grape brandy distilled once and bottled at full still strength with no water added. Flavors range from earthy and fruity (Quebranta) to intensely floral (Italia, Torontel).","accent":"The strictest pisco rules: single distillation, no dilution and no wood, so it tastes purely of the grape.","sources":["https://www.diffordsguide.com/encyclopedia/550/bws/peruvian-pisco","https://punchdrink.com/?p=1439","https://www.diffordsguide.com/beer-wine-spirits/category/849/italia-peruvian-pisco","https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5/subpart-I/section-5.145"],"confidence":"high"},{"id":"pisco-chile","name":"Chilean Pisco","category":"brandy","aka":["Pisco Chileno","Pisco Especial","Pisco Reservado","Gran Pisco"],"country":"Chile","region":"Atacama and Coquimbo regions (Norte Chico)","base":"grapes (mainly Muscat varieties, plus Pedro Jiménez and Torontel)","production":"Muscat-dominant wine is distilled in batch (pot) stills, typically reduced with water to bottling strength, and sold clear or after resting in wood.","legal":"Chilean DO (Decreto 521, 2000): wine from approved varieties (principal: Moscatel de Alejandría, Moscatel Rosada, Torontel, Moscatel de Austria, Pedro Jiménez) grown in the Atacama and Coquimbo regions; discontinuous (batch) distillation; rested at least 60 days; graded by strength: Corriente/Tradicional at least 30%, Especial 35%, Reservado 40%, Gran Pisco 43% ABV; 'Guarda' means at least 180 days and 'Envejecido' at least 360 days in wood; sugar at most 5 g/L. US labeling: 'Pisco Chileno' / 'Chilean Pisco'.","descriptors":["floral","tropical fruit","orange peel","lemon","rose","crisp","light"],"structure":{"sweetness":2,"body":2,"heat":2,"smoke":1,"oak":1},"abv":"35-43% (40% common for export)","age":"mostly unaged; Guarda 180+ days, Envejecido 360+ days in wood","look":"crystal clear to pale gold (wood-rested)","finish":"short","price":"$-$$","serve":["in cocktails","highball","on the rocks"],"glass":"highball","cocktails":["Pisco Sour","Piscola","Pisco Punch"],"food":{"classic":["ceviche","empanadas","grilled seafood"],"avoid":[]},"examples":["Capel","Alto del Carmen","Mistral","Waqar"],"kindred":["Peruvian Pisco","Grappa","American Brandy"],"summary":"Chilean pisco is a grape brandy from Chile's dry north, made mostly from fragrant Muscat grapes. It is usually lighter and more floral than Peruvian pisco and is often drunk with cola (the Piscola).","accent":"Unlike Peru, Chile permits water reduction and wood aging and grades its piscos by alcoholic strength.","sources":["https://www.sag.cl/sites/default/files/decreto_ndeg_521.pdf","https://punchdrink.com/?p=1439","https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5/subpart-I/section-5.145"],"confidence":"medium"},{"id":"grappa","name":"Grappa","category":"brandy","aka":["acquavite di vinaccia","grappa barricata","grappa riserva"],"country":"Italy","region":"Italy (mainly the north: Veneto, Friuli, Trentino, Piedmont)","base":"grape pomace (marc)","production":"Fermented grape skins, seeds and stems left after winemaking are distilled with steam or in a bain-marie; most is bottled young and clear, some is aged in wood.","legal":"EU grape marc spirit: from fermented grape marc (limited lees), distilled under 86% ABV, minimum 37.5% ABV, no added alcohol, sugar at most 20 g/L. 'Grappa' is a protected geographical indication: produced and distilled in Italy, by distilling pomace directly with steam or with water added to the still; lees may supply no more than 35% of the alcohol. Italian technical file (2016): 'vecchia'/'invecchiata' at least 12 months in wood; 'riserva'/'stravecchia' at least 18 months; a container term such as 'barrique' requires at least half the minimum aging in that container; caramel (up to 2%) only in grappa aged 12+ months.","descriptors":["grassy","floral","green apple","fermented fruit","fresh herbs","nutty","hot","dry"],"structure":{"sweetness":1,"body":2,"heat":4,"smoke":1,"oak":1},"abv":"40-50%","age":"mostly unaged; invecchiata/vecchia 12+ months, riserva/stravecchia 18+ months in wood","look":"crystal clear (aged: straw to gold)","finish":"medium","price":"$$-$$$","serve":["neat","slightly chilled","in espresso (caffè corretto)"],"glass":"tulip","cocktails":["Caffè Corretto"],"food":{"classic":["espresso","aged hard cheese","biscotti"],"avoid":[]},"examples":["Nonino","Nardini","Jacopo Poli","Marolo"],"kindred":["Peruvian Pisco","Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)","Chilean Pisco"],"summary":"Grappa is Italy's pomace brandy, made by distilling the skins and seeds left over from winemaking. Young grappa is clear, fiery and aromatic, and it is traditionally drunk after dinner as a digestif.","accent":"Made from pomace rather than wine, so it is more rustic, grassy and grape-skin-aromatic than wine brandies.","sources":["https://www.legislation.gov.uk/eur/2019/787/annexes/adopted","https://en.wikipedia.org/wiki/Grappa","https://www.varesenews.it/2016/02/grappa-nuove-regole-per-imbottigliamento-e-invecchiamento/484780/?output=pdf"],"confidence":"high"},{"id":"american-brandy","name":"American Brandy","category":"brandy","aka":["California brandy","alembic brandy","applejack (apple brandy)"],"country":"USA","region":"Mostly California; also Kentucky, Oregon, Michigan and elsewhere","base":"grapes (mostly); also apples and other fruit","production":"Mainstream California grape brandy is column-distilled and aged in used American oak; craft 'alembic' brandies are pot-distilled from wine grapes and aged in French or American oak.","legal":"US standard (27 CFR 5.145): distilled from fermented fruit juice, mash or wine (or residue) at under 95% ABV, bottled at no less than 40% ABV, with the character of brandy. Grape brandy stored in oak under 2 years must be labeled 'immature'. Apple brandy may be called applejack; plum brandy slivovitz; cherry brandy kirschwasser.","descriptors":["vanilla","caramel","dried apricot","raisin","toasted oak","baking spice","smooth","mellow"],"structure":{"sweetness":3,"body":3,"heat":2,"smoke":1,"oak":3},"abv":"40-50%","age":"mainstream 2-4 years; craft bottlings 4-20+ years","look":"amber","finish":"medium","price":"$-$$$","serve":["in cocktails","on the rocks","neat"],"glass":"rocks","cocktails":["Brandy Old Fashioned","Brandy Alexander","Sidecar","Stinger"],"food":{"classic":["pecan pie","roast pork","aged cheddar"],"avoid":[]},"examples":["Christian Brothers","E&J","Germain-Robin","Copper & Kings"],"kindred":["Cognac VS","Bourbon (Kentucky straight)","Calvados"],"summary":"American brandy is mostly California grape brandy, usually soft, sweet-tasting and vanilla-forward from American oak. A small craft scene also makes pot-distilled brandies that compete with fine cognac.","accent":"American oak and looser rules give a rounder, more bourbon-like vanilla-and-caramel profile than French brandy.","sources":["https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5/subpart-I/section-5.145","https://www.wineenthusiast.com/culture/spirits/10-all-american-brandies-you-shouldnt-overlook/"],"confidence":"high"},{"id":"fruit-eau-de-vie","name":"Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)","category":"brandy","aka":["Kirschwasser","Poire Williams","Framboise","Obstbrand","Schnaps","Himbeergeist"],"country":"France, Germany, Switzerland, Austria (also USA)","region":"Alsace, Black Forest, the Alps","base":"fruit (cherries, Williams pears, raspberries, apricots and more)","production":"Ripe fermented fruit (cherries with their stones) is distilled, often twice, in small pot stills and bottled clear and unaged to keep the aroma; low-sugar fruits like raspberries are usually macerated in neutral spirit and then distilled.","legal":"EU fruit spirit (may be called 'eau-de-vie' or '-wasser'): from fermented fresh fruit, each distillation under 86% ABV, minimum 37.5% ABV, no added alcohol or flavouring, sweetening at most 18 g/L. Spirits made by macerating certain berries in alcohol and then distilling must be labeled 'obtained by maceration and distillation'; '-geist' is made by macerating unfermented fruit in alcohol before distillation. US: cherry brandy may be labeled kirschwasser. Zuger Kirsch and Rigi Kirsch share a Swiss AOP (registered 2013).","descriptors":["cherry","pear","nutty","floral","mineral","crisp","dry","hot"],"structure":{"sweetness":1,"body":2,"heat":4,"smoke":1,"oak":1},"abv":"40-45% (kirsch up to 50%)","age":"","look":"crystal clear","finish":"medium","price":"$$-$$$","serve":["neat","slightly chilled","as a digestif"],"glass":"tulip","cocktails":["Rose"],"food":{"classic":["cheese fondue","Black Forest cake","fruit tarts"],"avoid":[]},"examples":["Massenez","Schladerer","Clear Creek","St. George"],"kindred":["Slivovitz (Plum Brandy)","Grappa","Calvados"],"summary":"Fruit eaux-de-vie are clear, unaged brandies that capture one fruit: cherry (kirsch), Williams pear or raspberry. They are bone-dry, intensely aromatic, and sipped in small amounts after a meal.","accent":"No oak and no sugar: pure distilled fruit aroma, unlike sweet fruit liqueurs or aged brandies.","sources":["https://www.legislation.gov.uk/eur/2019/787/annexes/adopted","https://en.wikipedia.org/wiki/Eau_de_vie","https://en.wikipedia.org/wiki/Kirschwasser","https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5/subpart-I/section-5.145"],"confidence":"medium"},{"id":"slivovitz","name":"Slivovitz (Plum Brandy)","category":"brandy","aka":["šljivovica","slivovice","śliwowica","plum rakija","szilvapálinka"],"country":"Serbia, Czech Republic, Slovakia, Croatia, Bosnia and Herzegovina, Poland, Hungary and neighbors","region":"Central and Southeastern Europe","base":"plums","production":"Plums are fermented (often with their stones) and distilled once or twice in copper stills; sold clear or aged, typically in oak.","legal":"In the EU it is a fruit spirit (fermented fruit, distillation under 86% ABV, at least 37.5% ABV, sweetening at most 18 g/L), and 'slivovitz' is one of the legal names permitted for plum spirit. US: plum brandy may be labeled slivovitz. Serbia's šljivovica traditions were inscribed on UNESCO's Intangible Cultural Heritage list in 2022.","descriptors":["stone fruit","prune","nutty","floral","toasted oak","hot","bold"],"structure":{"sweetness":1,"body":3,"heat":4,"smoke":1,"oak":2},"abv":"40-55% (homemade often higher)","age":"unaged or oak-aged; aged versions often 1-10 years","look":"crystal clear to golden","finish":"medium-long","price":"$-$$","serve":["neat","chilled shot","as a toast"],"glass":"cordial","cocktails":[],"food":{"classic":["cured meats","pickled vegetables","plum dumplings"],"avoid":[]},"examples":["R. Jelínek","Maraska"],"kindred":["Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)","Grappa","Calvados"],"summary":"Slivovitz is a strong plum brandy made across Central and Eastern Europe, often at home. It tastes of ripe and dried plum with an almond note from the stones, and older bottles pick up color and softness from oak.","accent":"A hearty, high-proof fruit brandy that is often wood-aged, unlike the delicate clear eaux-de-vie of the Alps.","sources":["https://ich.unesco.org/en/RL/social-practices-and-knowledge-related-to-the-preparation-and-use-of-the-traditional-plum-spirit-ljivovica-01882","https://en.wikipedia.org/wiki/Slivovitz","https://www.legislation.gov.uk/eur/2019/787/annexes/adopted","https://www.ecfr.gov/current/title-27/chapter-I/subchapter-A/part-5/subpart-I/section-5.145"],"confidence":"medium"},{"id":"london-dry-gin","name":"London Dry Gin","category":"gin","aka":["London gin","dry gin"],"country":"England (style made worldwide)","region":"","base":"neutral agricultural spirit (usually grain) redistilled with juniper and other botanicals","production":"Neutral spirit is redistilled with juniper, coriander, angelica, citrus peel and other natural botanicals; afterwards only water, more neutral spirit and a trace of sugar may be added.","legal":"EU: 'London gin' is a distilled gin whose flavour comes only from redistilling high-purity agricultural alcohol (methanol max 5 g/hl) with natural botanicals, the distillate reaching at least 70% ABV; afterwards only same-quality alcohol and water may be added, sweetening max 0.1 g/l, no colouring, min 37.5% ABV; 'dry' may be added to the name. The term is a style, not a place: it can be made anywhere. US: gin must take its main flavour from juniper and be bottled at min 40% ABV; 'London' and 'Dry' may be used only for gin made by original distillation or redistillation.","descriptors":["juniper","coriander","citrus botanicals","angelica","lemon","dry","crisp"],"structure":{"sweetness":1,"body":2,"heat":3,"smoke":1,"oak":1},"abv":"40-47%","age":"","look":"crystal clear","finish":"medium","price":"$-$$","serve":["highball","in cocktails","chilled in a martini"],"glass":"highball","cocktails":["Dry Martini","Gin and Tonic","Negroni","Gimlet","Tom Collins"],"food":{"classic":["oysters","smoked salmon","cucumber sandwiches"],"avoid":["heavy chocolate desserts"]},"examples":["Beefeater","Tanqueray London Dry","Gordon's","Sipsmith London Dry"],"kindred":["Plymouth Gin","Navy-Strength Gin","Contemporary / New Western Gin"],"summary":"London dry is the classic, juniper-forward gin: piney, citrusy and completely unsweetened. It is the default gin of the Martini and the Gin and Tonic.","accent":"Its rules are about method, not place: all flavour must come from redistilling with real botanicals, with essentially no sugar or colour added afterwards.","sources":["https://www.legislation.gov.uk/eur/2019/787/annex/I/adopted","https://www.law.cornell.edu/cfr/text/27/5.144","https://www.diffordsguide.com/g/1108/gin/new-western-dry-gins"],"confidence":"high"},{"id":"plymouth-gin","name":"Plymouth Gin","category":"gin","aka":["Plymouth"],"country":"England","region":"Plymouth, Devon","base":"neutral grain spirit redistilled with botanicals","production":"Distilled at the Black Friars distillery in Plymouth with seven botanicals (juniper, coriander, cardamom, orange and lemon peel, orris and angelica); it uses more root botanicals than a typical London dry.","legal":"Plymouth Gin once held an EU geographical indication, but the owner chose not to renew it and it lapsed in 2015. Today 'Plymouth Gin' is a trademark and the product is made as a distilled gin (EU min 37.5% ABV; US min 40%).","descriptors":["juniper","coriander","earth","citrus botanicals","angelica","smooth","mellow"],"structure":{"sweetness":1,"body":2,"heat":2,"smoke":1,"oak":1},"abv":"41.2% (Original Strength); 57% Navy Strength","age":"","look":"crystal clear","finish":"medium","price":"$$","serve":["in cocktails","highball","chilled in a martini"],"glass":"coupe","cocktails":["Dry Martini","Gimlet","Pink Gin","Gin and Tonic"],"food":{"classic":["shellfish","grilled white fish","olives"],"avoid":[]},"examples":["Plymouth Gin Original Strength","Plymouth Gin Navy Strength"],"kindred":["London Dry Gin","Navy-Strength Gin","Old Tom Gin"],"summary":"Plymouth is a softer, earthier English gin made in one historic distillery in the port of Plymouth. It is less piney than a London dry, with gentle citrus and a rounder feel.","accent":"It is effectively a single-producer style: the name once had legal xony (Germany)","base":"malt wine (moutwijn) from grains such as rye, wheat, barley and corn, blended with grain neutral spirit and juniper","production":"A malty, pot-distilled 'malt wine' is blended with neutral grain spirit and juniper-flavoured distillate; jonge (young) and oude (old) are recipe styles, and some oude and korenwijn are aged in oak.","legal":"Genever/jenever/genièvre is an EU geographical indication limited to Belgium, the Netherlands, two French departments (Nord, Pas-de-Calais) and two German states (North Rhine-Westphalia, Lower Saxony). The technical file requires at least 30% ABV, juniper flavour with other botanicals not dominating it, at least 1.5% malt wine in the alcohol, sugar under 20 g/l and caramel as the only colouring. 'Jonge' and 'oude' refer to recipe, not age; ageing claims need at least one year in wood.","descriptors":["malt","juniper","bread","cereal","toasted grain","smooth","oily"],"structure":{"sweetness":2,"body":3,"heat":2,"smoke":1,"oak":2},"abv":"30-40% (jonge often 35%; oude and korenwijn often 38-40%)","age":"Jonge usually unaged; oude and korenwijn often oak-aged 1-3+ years","look":"clear (jonge) to pale gold (aged oude, korenwijn)","finish":"medium","price":"$$","serve":["neat","chilled shot","in cocktails","with a beer chaser (kopstootje)"],"glass":"tulip","cocktails":["Improved Holland Gin Cocktail","Holland Gin Fizz","Collins (original genever version)"],"food":{"classic":["pickled herring","aged Gouda","bitterballen"],"avoid":[]},"examples":["Bols Genever","Filliers Oude Graanjenever","Rutte Oude Genever"],"kindred":["Old Tom Gin","Aquavit","Corn Whiskey & Moonshine"],"summary":"Genever is the Dutch and Belgian ancestor of gin, built on a bready, whisky-like malt spirit with juniper on top. Young (jonge) styles are lighter; old (oude) styles are maltier and richer.","accent":"Its malt-wine base gives a grainy, almost unaged-whisky body that no other gin has.","sources":["https://rvo.nl/sites/default/files/2022-06/Productdossier-jenever.pdf","https://en.wikipedia.org/wiki/Jenever"],"confidence":"high"},{"id":"sloe-gin","name":"Sloe Gin","category":"gin","aka":["sloe gin liqueur"],"country":"England (made widely)","region":"","base":"gin macerated with sloes (blackthorn fruit) and sugar","production":"Sloes are steeped in gin, usually with sugar, for weeks to months, then the liquid is strained; sloe juice may be added.","legal":"EU: sloe gin is a liqueur made by macerating sloes in gin (sloe juice may be added), using only natural flavourings, at least 25% ABV; it may be labelled 'sloe gin liqueur'. US: a cordial/liqueur whose main flavour comes from sloe berries (liqueurs need at least 2.5% sugar by weight).","descriptors":["dark fruit","cherry","juniper","nutty","sweet","silky","rich"],"structure":{"sweetness":4,"body":3,"heat":2,"smoke":1,"oak":1},"abv":"25-30% (EU min 25%; homemade and older styles vary)","age":"","look":"deep ruby red","finish":"medium","price":"$$","serve":["neat","on the rocks","in cocktails","topped with sparkling wine"],"glass":"cordial","cocktails":["Sloe Gin Fizz","Sloe Comfortable Screw","Charlie Chaplin","Blackthorn"],"food":{"classic":["game pie","Stilton","dark chocolate"],"avoid":[]},"examples":["Plymouth Sloe Gin","Sipsmith Sloe Gin","Hayman's Sloe Gin"],"kindred":["Crème de Cassis","Maraschino Liqueur","Fruit Eau-de-Vie (Kirsch, Poire Williams, Framboise)"],"summary":"Sloe gin is a ruby-red liqueur made by soaking tart wild sloe berries in gin with sugar. It tastes of plum and cherry with a bitter-almond edge and a hint of juniper.","accent":"Despite the name it is a liqueur, not a gin: lower in alcohol and clearly sweet.","sources":["https://www.legislation.gov.uk/eur/2019/787/annex/I/adopted","https://www.law.cornell.edu/cfr/text/27/5.150","https://en.wikipedia.org/wiki/Sloe_gin"],"confidence":"high"},{"id":"navy-strength-gin","name":"Navy-Strength Gin","category":"gin","aka":["gunpowder proof gin","100 UK proof gin"],"country":"England
