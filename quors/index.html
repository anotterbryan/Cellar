<style>
:root{--ox:#4A2C17;--ox2:#3A2313;--gold:#C99A4A;--paper:#FBF6EE;--tint:#F1E4CF;--rule:#DCC8A6;--ink:#2B1F16;--muted:#7A6652;--ok:#2F6B3A}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.45;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{background:var(--ox2);color:#F2E3C2;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:12px}.wordmark{font-family:'Parisienne','Snell Roundhand','Apple Chancery',cursive;font-size:36px;line-height:1;color:#F2E3C2;cursor:pointer;padding:2px 6px 0 2px}
.hbtn{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(242,227,194,.6);background:none;color:#F2E3C2;font:700 17px Inter,sans-serif;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#2A180C;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.25)}
.tab{background:none;border:0;color:rgba(242,227,194,.65);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px Inter,sans-serif;cursor:pointer;padding:4px 8px}.tab.on{color:#F2E3C2}
.tab .ico{width:26px;height:26px}
main{max-width:760px;margin:0 auto;padding:14px 16px}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:18px 16px;margin-bottom:14px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ox);margin:0 0 6px;line-height:1.1}h1{font-size:34px}h2{font-size:28px}h3{font-size:22px}
.kick{font:700 12px Inter,sans-serif;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.status{font:400 14px Inter,sans-serif;color:var(--muted)}
.ico{width:1.2em;height:1.2em;vertical-align:-.25em;flex:none}
.tile{display:flex;gap:14px;align-items:center;border:1px solid var(--rule);border-radius:16px;padding:14px;margin:10px 0;background:#fff;cursor:pointer}
.tile .ic{width:54px;height:54px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}.tile .ic .ico{width:34px;height:34px;color:var(--ox)}
.tile .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:var(--ox)}.tile .d{font-size:15px;color:var(--muted);line-height:1.35}
.tile.primary{background:linear-gradient(150deg,#3A2313,#7A4A22);border:none}.tile.primary .t,.tile.primary .d{color:#F2E3C2}.tile.primary .ic{background:rgba(242,227,194,.14)}.tile.primary .ic .ico{color:#F2E3C2}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ox);background:#fff;color:var(--ox);border-radius:999px;padding:7px 14px;font:600 14px Inter,sans-serif;cursor:pointer;margin:3px 4px 3px 0}
.btn.solid{background:var(--ox);color:#F2E3C2}.btn .ico{width:18px;height:18px}
.bigbtn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ox);color:#F2E3C2;padding:14px 18px;font:700 17px Inter,sans-serif;cursor:pointer;margin:8px 0}
input[type=text],textarea,select{width:100%;font:16px Inter,sans-serif;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:90px}.fl{font:700 13px Inter,sans-serif;color:var(--ox);margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;margin:3px 4px 3px 0;font:600 13px Inter,sans-serif;border:0;cursor:pointer}
.chip .ico{width:17px;height:17px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font:700 12px Inter,sans-serif;color:#fff;margin-right:6px}
.sec{font:700 12px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.bars{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font:600 13px Inter,sans-serif;align-items:center}.bar{display:flex;gap:4px}.bar i{height:9px;flex:1;border-radius:5px;background:var(--tint)}.bar i.on{background:var(--ox)}
.row{font-size:17px;margin:2px 0}.src{font:12px Inter,sans-serif;color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{border:1px solid var(--rule);border-radius:14px;background:#fff;padding:12px 8px;text-align:center;cursor:pointer;font:600 14px Inter,sans-serif;color:var(--ox)}.cat .ico{width:36px;height:36px;display:block;margin:0 auto 4px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}.item:first-child{border-top:0}
.item .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}.item .ic .ico{width:28px;height:28px;color:var(--ox)}
.item .n{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--ox);line-height:1.15}.item .s{font:13px Inter,sans-serif;color:var(--muted)}
.item img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.ing{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:17px}.ing .a{font:600 14px Inter,sans-serif;color:var(--ox);white-space:nowrap}
.have{color:var(--ok);font:700 12px Inter,sans-serif}.need{color:#A0522D;font:700 12px Inter,sans-serif}
.seg{display:flex;border:1.5px solid var(--ox);border-radius:999px;overflow:hidden;margin:8px 0}.seg button{flex:1;border:0;background:#fff;color:var(--ox);font:600 13px Inter,sans-serif;padding:8px 4px;cursor:pointer}.seg button.on{background:var(--ox);color:#F2E3C2}
.qty{display:inline-flex;align-items:center;gap:6px;font:700 14px Inter,sans-serif}.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ox);background:#fff;color:var(--ox);font-weight:700;cursor:pointer}
.glance{background:var(--tint);border-radius:14px;padding:12px 14px;margin:12px 0}.glance .k{font:700 11px Inter,sans-serif;letter-spacing:.12em;color:var(--gold)}
.sheet{position:fixed;inset:0;background:rgba(20,10,4,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheetin{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
.hhbox{border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0;background:#FFFCF6}.hhbox .k{font:700 11px Inter,sans-serif;letter-spacing:.12em;color:var(--gold)}.hhcode{font:700 26px Inter,sans-serif;letter-spacing:.12em;color:var(--ox);margin:6px 0}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#eee}
@media (prefers-color-scheme:dark){:root{--paper:#1E140D;--ink:#EFE3D0;--muted:#BCA88E;--tint:#3A2A1C;--rule:#4E3A28}.card,.tile,.cat,.btn,input[type=text],textarea,select,.seg button,.qty button{background:#2A1D13;color:var(--ink)}
 h1,h2,h3,.tile .t,.item .n,.cat,.fl,.ing .a{color:#F2E3C2}.btn,.seg,.qty button{border-color:#C99A4A;color:#F2E3C2}.btn.solid,.seg button.on{background:#C99A4A;color:#1E140D}.tile .ic .ico,.item .ic .ico{color:#F2E3C2}.bar i.on{background:#C99A4A}.hhbox{background:#2A1D13}.hhcode{color:#F2E3C2}}
</style>
</head>

<script>
const DATA = {"variations":{"families":[{"id":"mule","name":"Mule / Buck","classic":["moscow-mule","dark-n-stormy"],"formula":"2 spirit + ½ lime + 4 ginger beer","variations":[{"name":"Kentucky Mule","named":true,"spirit":["bourbon"],"changes":"Bourbon instead of vodka; otherwise as a Moscow Mule.","confidence":"high"},{"name":"Mexican Mule","named":true,"spirit":["tequila-blanco"],"changes":"Tequila instead of vodka; lime and ginger beer as usual.","confidence":"high"},{"name":"Gin Buck","named":true,"spirit":["london-dry-gin"],"changes":"Gin with lemon (or lime) juice topped with ginger ale: the older 'buck' template the Moscow Mule descends from.","note":"Also called a London Buck or British Buck.","confidence":"high"},{"name":"Gin-Gin Mule","named":true,"spirit":["london-dry-gin"],"changes":"Gin with muddled mint, lime, simple syrup and homemade ginger beer, served tall.","note":"Audrey Saunders, NYC (c. 2000); later a signature at her Pegu Club.","confidence":"high"},{"name":"Mezcal Mule","named":true,"spirit":["mezcal-espadin"],"changes":"Mezcal with lime, passion fruit purée, cucumber, agave and ginger beer.","note":"Jim Meehan, PDT, NYC (published in The PDT Cocktail Book, 2011).","confidence":"high"},{"name":"Irish Mule","named":true,"spirit":["blended-irish"],"changes":"Irish whiskey instead of vodka; otherwise as a Moscow Mule.","confidence":"medium"},{"name":"Mamie Taylor","named":true,"spirit":["blended-scotch"],"changes":"Scotch with lime juice and ginger ale (rather than ginger beer).","note":"c. 1899-1900; the Scotch 'buck' predating the Moscow Mule.","confidence":"high"}]},{"id":"old-fashioned","name":"Old Fashioned","classic":["old-fashioned","sazerac"],"formula":"2 spirit + 1 tsp sugar/syrup + 2 dashes bitters, stirred over ice, citrus twist","variations":[{"name":"Rye Old Fashioned","named":false,"spirit":["american-rye"],"changes":"Rye whiskey instead of bourbon; same sugar, bitters and orange twist.","note":"Descriptive name; rye was a common original base.","confidence":"medium"},{"name":"Oaxaca Old Fashioned","named":true,"spirit":["tequila-reposado","mezcal-espadin"],"changes":"Reposado tequila split with mezcal, a barspoon of agave nectar instead of sugar, Angostura bitters (many modern specs use chocolate/cocoa bitters), flamed orange twist.","note":"Phil Ward, Death & Co, NYC (2007).","confidence":"high"},{"name":"Rum Old Fashioned","named":false,"spirit":["aged-dark-rum"],"changes":"Aged rum instead of whiskey; often demerara syrup and Angostura.","confidence":"medium"},{"name":"Brandy Old Fashioned (Wisconsin-style)","named":true,"spirit":["american-brandy"],"changes":"Brandy with muddled orange, cherry and sugar, bitters, topped with lemon-lime soda ('sweet') or grapefruit soda/sour mix ('sour').","confidence":"high"},{"name":"Improved Whiskey Cocktail","named":true,"spirit":["american-rye","bourbon","maraschino","absinthe"],"changes":"Whiskey old fashioned 'improved' with a little maraschino liqueur and absinthe.","note":"Jerry Thomas, 1876.","confidence":"high"},{"name":"Improved Holland Gin Cocktail","named":true,"spirit":["genever","maraschino","absinthe"],"changes":"Genever instead of whiskey, with maraschino, absinthe, gum syrup and bitters.","note":"Jerry Thomas, 1876.","confidence":"high"},{"name":"Benton's Old Fashioned","named":true,"spirit":["bourbon"],"changes":"Bacon-fat-washed bourbon (Benton's bacon) with maple syrup instead of sugar and Angostura.","note":"Don Lee, PDT, NYC (c. 2007-08); the drink that popularised fat-washing.","confidence":"high"},{"name":"Sazerac (cognac / split base)","named":true,"spirit":["cognac-vs","american-rye","absinthe"],"changes":"Cognac in place of (or split with) rye in a Sazerac; Peychaud's bitters, absinthe rinse.","note":"Often cited as the earlier form, though the history is disputed.","confidence":"medium"}]},{"id":"sour","name":"Sour","classic":["whiskey-sour","pisco-sour","daiquiri","gimlet"],"formula":"2 spirit + ¾ lemon/lime + ¾ simple syrup (+ optional egg white)","variations":[{"name":"New York Sour","named":true,"spirit":["bourbon","american-rye"],"changes":"Whiskey sour finished with a red wine float.","confidence":"high"},{"name":"Ward Eight","named":true,"spirit":["american-rye"],"changes":"Rye with lemon and orange juice and grenadine instead of plain syrup.","note":"Boston; often credited to Locke-Ober Café (1898), though the claim is disputed (a rival claim says 1903). In print by 1913.","confidence":"high"},{"name":"Gin Sour","named":false,"spirit":["london-dry-gin"],"changes":"Gin instead of whiskey; lemon, sugar, optional egg white.","confidence":"high"},{"name":"Brandy Sour","named":false,"spirit":["cognac-vs"],"changes":"Brandy/cognac instead of whiskey; lemon and sugar.","confidence":"high"},{"name":"Rum Sour","named":false,"spirit":["aged-dark-rum"],"changes":"Rum (often aged) with lemon or lime and sugar, optional egg white.","confidence":"high"},{"name":"Chilean Pisco Sour","named":true,"spirit":["pisco-chile"],"changes":"Chilean pisco with lime juice and sugar; usually no egg white and no Angostura garnish, unlike the Peruvian style.","confidence":"medium"},{"name":"Amaretto Sour (Morgenthaler)","named":true,"spirit":["amaretto","bourbon"],"changes":"Amaretto as the base, fortified with cask-strength bourbon, lemon, a little syrup and egg white.","note":"Jeffrey Morgenthaler, Clyde Common, Portland (2012).","confidence":"high"},{"name":"Penicillin","named":true,"spirit":["blended-scotch","islay-scotch"],"changes":"Blended Scotch with lemon and honey-ginger syrup, with an Islay Scotch float.","note":"Sam Ross, Milk & Honey (2005); a whisky-sour riff.","confidence":"high"}]},{"id":"daisy","name":"Margarita / Daisy / Sidecar","classic":["margarita","tommys-margarita","sidecar","cosmopolitan"],"formula":"2 spirit + 1 orange liqueur + ¾ lemon/lime","variations":[{"name":"Kamikaze","named":true,"spirit":["grain-vodka","orange-liqueur"],"changes":"Vodka, triple sec and lime, shaken (often as a shot).","confidence":"high"},{"name":"Balalaika","named":true,"spirit":["grain-vodka","orange-liqueur"],"changes":"Vodka in place of cognac in a sidecar: vodka, triple sec, lemon.","confidence":"high"},{"name":"White Lady","named":true,"spirit":["london-dry-gin","orange-liqueur"],"changes":"Gin, triple sec and lemon (egg white optional).","note":"Origin disputed: claimed for Harry MacElhone (a 1919 brandy-based version; gin version c. 1929), Harry Craddock at the Savoy, and Victor Cabrin; in The Savoy Cocktail Book (1930).","confidence":"high"},{"name":"Pegu Club","named":true,"spirit":["london-dry-gin","orange-liqueur"],"changes":"Gin with orange curaçao, lime and Angostura + orange bitters.","note":"Pegu Club, Rangoon (1920s).","confidence":"high"},{"name":"Between the Sheets","named":true,"spirit":["cognac-vs","spanish-style-rum","orange-liqueur"],"changes":"Sidecar split between cognac and light rum, with triple sec and lemon.","confidence":"high"},{"name":"Brandy Crusta","named":true,"spirit":["cognac-vs","orange-liqueur","maraschino"],"changes":"Ancestor of the sidecar: cognac, orange curaçao, lemon, maraschino and bitters in a sugar-rimmed glass with a long lemon peel.","note":"Joseph Santini, New Orleans (1850s).","confidence":"high"},{"name":"Mezcal Margarita","named":true,"spirit":["mezcal-espadin","orange-liqueur"],"changes":"Mezcal in place of (or split with) tequila.","confidence":"medium"},{"name":"Tommy's Mezcal Margarita","named":true,"spirit":["mezcal-espadin"],"changes":"Tommy's formula (lime + agave syrup, no orange liqueur) with mezcal.","confidence":"medium"}]},{"id":"negroni","name":"Negroni","classic":["negroni","boulevardier","americano"],"formula":"1 spirit + 1 bitter aperitivo + 1 sweet vermouth","variations":[{"name":"Old Pal","named":true,"spirit":["american-rye","dry-vermouth","bitter-aperitivo"],"changes":"Rye with Campari and dry (not sweet) vermouth.","note":"Harry MacElhone, Harry's New York Bar, Paris; named for journalist William 'Sparrow' Robertson. Printed in his 1920s books (Punch says ABC of Mixing Cocktails, 1922; Difford's says Barflies and Cocktails, 1927).","confidence":"high"},{"name":"Kingston Negroni","named":true,"spirit":["jamaican-rum","bitter-aperitivo","sweet-vermouth"],"changes":"Funky Jamaican rum (Smith & Cross) in place of gin.","note":"Joaquín Simó, New York.","confidence":"high"},{"name":"Mezcal Negroni","named":false,"spirit":["mezcal-espadin","bitter-aperitivo","sweet-vermouth"],"changes":"Mezcal in place of gin; equal parts.","confidence":"high"},{"name":"Rosita","named":true,"spirit":["tequila-reposado","bitter-aperitivo","sweet-vermouth","dry-vermouth"],"changes":"Tequila with Campari and split sweet + dry vermouth, Angostura.","confidence":"high"},{"name":"Cardinale","named":true,"spirit":["london-dry-gin","bitter-aperitivo","dry-vermouth"],"changes":"Negroni with dry vermouth instead of sweet.","note":"Same spirit; vermouth swap.","confidence":"medium"},{"name":"White Negroni","named":true,"spirit":["london-dry-gin","quinquina"],"changes":"Gin with Suze (gentian) in place of Campari and Lillet Blanc in place of sweet vermouth.","note":"Wayne Collins, London/Bordeaux (2001).","confidence":"high"}]},{"id":"manhattan","name":"Manhattan","classic":["manhattan","rob-roy","vieux-carre"],"formula":"2 spirit + 1 sweet vermouth + 2 dashes bitters, stirred","variations":[{"name":"Brooklyn","named":true,"spirit":["american-rye","dry-vermouth","maraschino","amaro"],"changes":"Rye with dry vermouth, maraschino and Amer Picon (substitute another bittersweet orange amaro if needed).","note":"First printed in Jacob A. Grohusko's Jack's Manual (1908), which used Italian vermouth; dry vermouth has been standard since 1913.","confidence":"high"},{"name":"Red Hook","named":true,"spirit":["american-rye","sweet-vermouth","maraschino"],"changes":"Rye with Punt e Mes and maraschino.","note":"Vincenzo 'Enzo' Errico, Milk & Honey, NYC (c. 2003-05).","confidence":"high"},{"name":"Black yed sweetness.","accent":"Usually gentler and more varied in smoke than Islay, but saltier and more maritime than mainland Highland malts.","sources":["https://www.legislation.gov.uk/uksi/2009/2890/regulation/10","https://www.scotch-whisky.org.uk/discover/enjoying-scotch/scotch-whisky-regions/","https://whiskyadvocate.com/go-beyond-islay-to-scotlands-other-whisky-islands"],"confidence":"medium"},{"id":"sherry-cask-scotch","name":"Sherry-Cask Single Malt Scotch","category":"whiskey","aka":["sherry bomb","sherried Scotch"],"country":"Scotland","region":"mainly Speyside and Highlands","base":"malted barley","production":"Pot-still single malt matured fully or partly in sherry-seasoned oak (usually European oak butts or hogsheads seasoned with oloroso or Pedro Ximénez).","legal":"Scotch Whisky Regulations 2009: made in Scotland from water and malted barley (other whole cereals allowed for grain whisky), converted only by the grain's own enzymes, distilled below 94.8% ABV, matured only in Scotland in oak casks of 700 L or less for at least 3 years, nothing added but water and plain caramel colouring, bottled at 40% ABV or more. 'Single Malt' = only water and malted barley, distilled in pot stills at a single distillery. Sherry cask use itself is not regulated beyond the 700 L oak-cask rule; nothing may be added except water and plain caramel.","descriptors":["sherried fruit","raisin","dates","dark fruit","chocolate","nutty","clove","rich"],"structure":{"sweetness":4,"body":4,"heat":3,"smoke":1,"oak":4},"abv":"40-46% (cask strength 55-62%)","age":"12-18 years common; NAS cask-strength widespread","look":"deep amber to mahogany","finish":"long","price":"$$-$$$$","serve":["neat","with a few drops of water"],"glass":"Glencairn","cocktails":["Rob Roy","Blood and Sand","Bobby Burns"],"food":{"classic":["dark chocolate","Christmas pudding","aged manchego"],"avoid":["delicate white fish"]},"examples":["The Macallan 12 Sherry Oak","GlenDronach 12","Aberlour A'bunadh","Glenfarclas pper","honey","sherried fruit","oily","creamy","rich"],"structure":{"sweetness":3,"body":4,"heat":3,"smoke":1,"oak":3},"abv":"40-46% (cask strength ~55-60%)","age":"NAS and 10-15 years common","look":"gold to amber","finish":"long","price":"$$-$$$","serve":["neat","with a few drops of water","on the rocks"],"glass":"Glencairn","cocktails":["Irish Coffee","Tipperary","Irish Old Fashioned"],"food":{"classic":["roast pork","soda bread with butter","apple crumble"],"avoid":[]},"examples":["Redbreast 12","Green Spot","Powers John's Lane","Midleton Barry Crockett Legacy"],"kindred":["Irish Single Malt Whiskey","Blended Irish Whiskey","Sherry-Cask Single Malt Scotch"],"summary":"Single pot still is Ireland's unique traditional style, made from a mix of malted and unmalted barley in copper pot stills. The raw barley gives a spicy kick and a famously creamy, oily texture.","accent":"Unmalted barley in the mash produces a spicy, mouth-coating richness found in no other whiskey style.","sources":["https://assets.publishing.service.gov.uk/media/685e913c62b2e559cbd7536b/Producing-Irish-whiskey-06-25.pdf","https://www.thespiritsbusiness.com/?p=915421","https://scotchwhisky.com/magazine/in-depth/24638/what-is-the-true-taste-of-irish-pot-still/","https://www.thewhiskyexchange.com/inspiration/article/18566/single-pot-still-irish-whiskey-history-style-revival-the-whisky-exchange"],"confidence":"high"},{"id":"blended-irish","name":"Blended Irish Whiskey","category":"whiskey","aka":["Irish blend"],"country":"Ireland","region":"","base":"grain whiskey (corn, wheat or barley) blended with pot still and/or malt whiskey","production":"Light column-still grain whiskey blended with pot still and/or malt whiskey; often (not always) triple distilled; matured in ex-bourbon and some sherry casks.","legal":"Irish Whiskey Technical File (GI): mashed, fermented and distilled at one distillery on the island of Ireland, saccharified only by malt enzymes (plus natural enzymes), distilled below 94.8% ABV, matured at least 3 years in wooden casks of 700 L or less in Ireland, only water and E150a caramel may be added, bottled at 40% ABV or more. Blended Irish whiskey: a blend of two or more of the styles Pot Still, Malt, Grain (or Irish whiskey), each GI-compliant and traceable. Triple distillation is not required.","descriptors":["vanilla","honey","green apple","cereal","toasted grain","pear","smooth","light"],"structure":{"sweetness":3,"body":2,"heat":2,"smoke":1,"oak":2},"abv":"40%","age":"NAS dominant; 12-18 year premium blends","look":"pale gold to gold","finish":"short","price":"$-$$","serve":["highball","on the rocks","in cocktails","neat","chilled shot"],"glass":"highball","cocktails":["Irish Coffee","Whiskey Sour","Irish Mule","Tipperary"],"food":{"classic":["fish and chips","Irish stew","oatmeal cookies"],"avoid":[]},"examples":["Jameson","Tullamore D.E.W.","Bushmills Original","Powers Gold Label"],"kindred":["Blended Scotch Whisky","Canadian Whisky","Irish Single Pot Still Whiskey"],"summary":"Blended Irish whiskey, the best-selling Irish style, combines light grain whiskey with fuller pot still or malt whiskey. It's known for being smooth, gentle and lightly sweet.","accent":"Typically smoother and less smoky than blended Scotch, with orchard-fruit and vanilla lightness.","sources":["https://assets.publishing.service.gov.uk/media/685e913c62b2e559cbd7536b/Producing-Irish-whiskey-06-25.pdf","https://whiskyadvocate.com/know-irish-whiskey-blends-guide/","https://distiller.com/articles/irish-whiskey-guide"],"confidence":"high"},{"id":"irish-single-malt","name":"Irish Single Malt Whiskey","category":"whiskey","aka":["Malt Irish Whiskey"],"country":"Ireland","region":"","base":"malted barley (100%)","production":"Distilled in pot stills at one distillery (Bushmills-style triple distillation or Cooley-style double), matured in bourbon, sherry, port and other casks; usually unpeated.","legal":"Irish Whiskey Technical File (GI): mashed, fermented and distilled at ith many still shapes and yeasts at one distillery; matured in bourbon, sherry, wine and native mizunara oak casks.","legal":"Voluntary JSLMA labeling standard (binding on members only, not law; in force 1 April 2021, labeling grace period to 31 March 2024): raw materials limited to malted grain (always required), other cereal grains, and water extracted in Japan; saccharified, fermented and distilled at a distillery in Japan, distilled to less than 95% ABV; matured in Japan for at least 3 years in wooden casks of 700 L or less; bottled in Japan at 40% ABV or more; plain caramel colouring allowed. 'Single malt' itself is not separately defined by the standard; producers follow the Scotch convention (100% malted barley, one distillery).","descriptors":["honey","stone fruit","vanilla","floral","malt","toasted oak","silky","smooth"],"structure":{"sweetness":3,"body":3,"heat":2,"smoke":2,"oak":3},"abv":"43-48%","age":"NAS dominant; 12, 18, 25 year statements scarce","look":"gold to amber","finish":"medium-long","price":"$$$-$$$$","serve":["neat","with a few drops of water","on the rocks","highball"],"glass":"Glencairn","cocktails":["Japanese Highball","Mizuwari","Old Fashioned"],"food":{"classic":["sushi","yakitori","tempura"],"avoid":[]},"examples":["Yamazaki 12","Hakushu 12","Nikka Yoichi Single Malt","Nikka Miyagikyo Single Malt"],"kindred":["Speyside Single Malt Scotch","Highland Single Malt Scotch","Japanese Blended Whisky"],"summary":"Japanese single malt began nearly a century ago by studying Scotch, and it's prized for precision and balance. Expect honeyed fruit and delicate oak, sometimes with incense-like notes from Japanese mizunara oak.","accent":"Built on Scotch methods but with a cleaner, more delicate balance; mizunara oak adds a unique sandalwood-incense character.","sources":["https://whiskyadvocate.com/japanese-whisky-finally-gets-a-definition-but-its-complicated","https://www.nomunication.jp/2021/02/17/finally-a-standard-for-japanese-whisky/","https:/
